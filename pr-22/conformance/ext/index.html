re-99-null-is-not-an-error"}, {"case": "failure/C/unknown-method", "consumer": "extqtproxy-async", "declared": false, "agree": true, "status": "pass", "known": "pre-99-null-is-not-an-error"}, {"case": "event/Record", "consumer": "py", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/Record", "consumer": "extqtproxy-sync", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/Record", "consumer": "extqtproxy-async", "declared": false, "agree": true, "status": "pass", "known": null}], "uncovered": [], "synthetic": [["?tstr", "method_return"], ["Blob", "record_field"], ["Opt", "record_field"], ["Wrapper", "record_field"], ["bstr", "record_field"], ["tstr", "record_field"], ["uint", "record_field"]], "registry": {"xfail": [{"id": "OPT2", "cases": ["Optional/scalar/empty-is-null"], "providers": ["test_fullapi_ext_rust", "test_fullapi_ext_cpp"], "consumers": ["py"], "summary": "an EMPTY optional in a positional slot has no expressible form on this stack — null is already the failure token", "correct_behaviour": "a positional slot has no key to omit and the arity must never change, so an empty `?tstr` argument and an empty `?tstr` return are both spelled null. echoOptional(null) must answer null, and that must be distinguishable from a call that failed.", "measured": {"return path": "null IS the failure token above the module. logos-protocol's logos_json_convert turns a null result into an INVALID QVariant, which core_service reports as METHOD_FAILED — stated at logos-qt-sdk qt-generator/lidl_gen_cdylib_glue.cpp:100-109, where it is the documented reason `void` needed a special case (the Rust backend's catch-all returned JSON null and the same void method answered `true` from C++ and `the call failed` from Rust). An empty optional return lands in exactly that hole.", "argument path (py driver)": "CLOSED. logoscore-py's client._arg_to_str used to JSON-encode only bytes/list/tuple/dict behind the CLI's `json:` prefix and fall through to str(arg), so a top-level None went over argv as the literal string \"None\" and this case could not even be SENT. logos-logoscore-py e7a5fee (#17) sends `json:null` for a top-level None. Nulls NESTED inside a container were always fine — they ride the `json:` path intact — which is why Optional/record/explicit-null and Optional/[Record]/mixed-presence were expressible before that landed and this one was not.", "what fails now": "the RETURN path alone. Measured actual on both providers: {\"__error__\": \"METHOD_FAILED\"} — the argument arrives, the module answers an empty optional, and null is read as failure on the way back."}, "fix_is": {"_prose": "bullets", "parts": ["argument side: DONE, logos-logoscore-py e7a5fee — `if arg is None: return \"json:null\"` in _arg_to_str.", "return side: a real decision, not a patch. Either the dispatch result carries presence out of band (the same missing channel as M4-residual: logos_rpc_status.h:24-27 says the slot returns a single QVariant and `deferred` has nowhere out-of-band to live), or `?T` is declared unusable as a bare return type and the contract says so. Making null mean `empty` on a wire where null already means `failed` is not a third option."]}, "note": "Kept as its own entry rather than folded into OPT1 because it survives OPT1's fix: implementing Option<T> in every generator does not make a null return distinguishable from METHOD_FAILED. If OPT1 lands and this cell still fails, that is the correct outcome and this entry is the reason it is not a surprise. Both halves were open when this entry was written; the argument half closed and the cell stayed red, which is the entry doing its job — it named which half would survive. The two proxy consumers are NOT on this entry: through them the same case fails for the return-SHAPE reason instead, which is ext-optional-return-shape-through-the-qt-proxy's claim, not this one's."}, {"id": "pre-99-null-is-not-an-error", "cases": ["failure/A/module-not-loaded", "failure/C/unknown-method"], "providers": ["test_fullapi_ext_cpp", "test_fullapi_ext_rust"], "consumers": ["py", "extqtproxy-sync", "extqtproxy-async"], "summary": "the same daemon defect known.json registers, seen from the table that owns the empty-optional cells: classes A, C and D are one METHOD_FAILED", "measured": {"failure/A/module-not-loaded": "METHOD_FAILED with no `error` object, on both ext providers", "failure/C/unknown-method": "METHOD_FAILED — indistinguishable from OPT2's class-D cell, measured in the same run by the same driver against the same two providers, which is the point of running the pair in one table", "failure/C through the Qt proxy": "METHOD_FAILED on extqtproxy-sync and extqtproxy-async, on both providers, in every run — the same answer py gets. That is why the two consumers were added to this entry rather than given one of their own: the defect is in the DAEMON's envelope, above every consumer surface, so a consumer axis cannot move it. failure/C is answered by the proxy's own cdylib dispatch, a different image from either provider's, and it still says the same thing.", "failure/A through the Qt proxy — NOT deterministic, and TWO drafts of this entry over-claimed about how": "failure/A never reaches a module at all (it names ghost_module), so every consumer calls the ghost directly and the coordinate names only the ENVIRONMENT of the call. The refusal comes back as METHOD_FAILED or as RPC_FAILED, and which coordinate gets the RPC_FAILED moves between runs. 7 runs x 6 coordinates = 42 samples at this fixture rev:\n    nix check        none\n    standalone base  py / cpp\n    r1               extqtproxy-async / rust\n    r2               extqtproxy-async / cpp\n    r3               none\n    all-isolated     none\n    mutant A         extqtproxy-sync / cpp\nSo: 3 of 7 runs had ZERO, 4 had exactly one; 1 of 14 py samples and 3 of 28 proxy samples. Both of the first draft's claims were false — it said 'exactly ONE each time' and 'never on py' — and the second draft repeated them. The py sample also refutes the explanation they rested on: it was attributed to a daemon holding the proxy PLUS both providers rather than the two providers alone, but the py daemon holds no proxy and produced RPC_FAILED anyway. What is actually established is that the acquire (~20s) can outrun the core_service RPC deadline under load, on any coordinate; the mechanism beyond that is not measured, and this entry no longer claims one. The gate is unaffected: an xfail is keyed by (case, provider, consumer), all six coordinates are registered, both shapes are the same class-A defect, and retirement keys on `object_unavailable`, which neither shape is. Recorded because a registry that claims a determinism it does not have is worse than one that names the flake — which is exactly the error this sentence made twice."}, "note": {"_prose": "bullets", "parts": ["OPT2 above is the class-D half of exactly this and retires in the same edit. It is kept as its own entry rather than folded in because its record is the history of three wrong diagnoses, and that record is worth more than the tidiness.", "THE CLASS-A CELL IS NOT DETERMINISTIC, and it was reproduced here rather than carried over: two back-to-back runs of this gate, same derivation inputs but for prose, answered METHOD_FAILED and then RPC_FAILED for test_fullapi_ext_rust on failure/A/module-not-loaded. The acquire takes ~20s and under load that outruns the core_service RPC's own deadline, so the daemon reports the RPC as failed instead of the acquire. The second run therefore also emitted a provider-differential row that the first did not, which is why this table's differential-provider split moves between runs (37/5 and 36/6 across the two). Neither token can turn the gate red while the entry stands — both are a failing cell and both providers are registered, so the cell and any differential it produces are xfail either way. It matters AFTER the lock bump, when the cell is expected to pass."]}, "fix_is": "logos-logoscore-py relocking `logos-logoscore-cli` past ed19258 (#99)", "retires_with": "OPT2, and known.json's entry of the same name", "relock_preview": {"_prose": "bullets", "parts": ["MEASURED ON THE py CONSUMER ALONE, at this fixture rev and before this table had a consumer axis. MEASURED at this fixture rev, not predicted. Against a logoscore built from logos-logoscore-cli master with everything else held fixed: 75 pass / 9 xfail / 4 xpass / 0 fail. The 4 xpass are three of this entry's four cells plus OPT2's C++ one — so this entry and OPT2 retire together, as they say they will. The fourth, failure/A/module-not-loaded on test_fullapi_ext_rust, did NOT xpass: it answered RPC_FAILED instead of object_unavailable, which is the non-determinism the note above records, seen in the very run that would have retired it.", "AND THE DRIVER IS LOAD-BEARING, measured as an A/B with one variable. The run above uses logos-logoscore-py's `error_code_of`, which prefers the envelope's nested `error.code` over its top-level `code`. With that one preference reverted — same CLI, same fixtures, same cases, same registry — the same table reports 66 pass / 15 xfail / 3 xpass / 9 FAIL. The 9 are cells that assert a CLASS and get the verdict instead: seven hostile/Optional/* cells expecting `dispatch_failed`, and failure/B/arity/too-few on both providers expecting `invalid_args`, all of them arriving as a bare METHOD_FAILED. Pre-#99 those classes reached the caller as a 3-key map in the RESULT and the client folded them; #99 folds them in the daemon and puts the class in `error.code`, where only a client that looks finds it. Without that change the lock bump looks like a matrix regression."]}}, {"id": "B-arity-overflow", "cases": ["failure/B/arity/too-many", "failure/B/arity/too-many-zero-parameter"], "providers": ["test_fullapi_ext_cpp", "test_fullapi_ext_rust"], "consumers": ["py", "extqtproxy-sync", "extqtproxy-async"], "summary": "an EXTRA argument is dropped and the call succeeds, on providers generated from a different contract than full_api's", "measured": {"echoBlob(<blob>, \"extra\")": "the blob, echoed, status ok — on both ext providers", "whoAmI(\"junk\")": "the module name, status ok — the zero-parameter path, where no guard is emitted at all", "the provider differential on whoAmI(\"junk\")": "test_fullapi_ext_rust answers \"test_fullapi_ext_rust\" and test_fullapi_ext_cpp answers \"test_fullapi_ext_cpp\", so the two providers DISAGREE and that row is registered here too. The disagreement is a consequence of the missing guard, not a second defect: the dropped argument lets the identity through, and the moment the guard lands both providers answer invalid_args and the differential agrees. Deliberately NOT spelled as expect_by_provider — that would declare a divergence the contract does not have, and would keep declaring it after the guard closed it.", "the UNDERFLOW half": "failure/B/arity/too-few PASSES on both ext providers at this base — `expected 1 arguments, got 0`. The C++ ext provider had no lower-bound guard when these cases were written; logos-cpp-sdk 44b92b0 (#127) supplied it and this fixture rev's lock has it, so the entry that covered it is not here.", "through the Qt proxy": "SAME ANSWER on both proxy consumers, and the call is served by a FIFTH module built from a THIRD contract: failure/B/arity/too-many calls echoBlob(<blob>, \"extra\") on test_fullapi_ext_qtproxy, whose own contract is derived from its impl header, and the extra argument is dropped there too (the blob comes back, status ok). whoAmI(\"junk\") likewise answers the bound provider's name. So the missing upper-bound guard is a property of the cdylib dispatch generator, not of these particular fixtures — which is what this entry has claimed since it was written, now with one more independent instance."}, "note": {"_prose": "bullets", "parts": ["Registered here as well as in known.json so the defect cannot be read as a property of the two full_api fixtures. Four modules, two contracts, two language backends, same answer.", "whoAmI is this contract's only zero-parameter method, which is why the ext half of the zero-parameter claim rides on an identity method while the full_api half rides on doVoid. The cost is the differential row above.", "The zero-parameter differential row this entry already owns is reproduced on both proxy consumers for the same reason: the dropped argument lets the identity through, and the proxy forwards whoAmI, so each provider still answers with its own name."]}, "fix_is": "the same upper-bound arity check known.json's B-arity-overflow names"}, {"id": "ext-optional-return-changed-on-one-provider", "cases": ["Optional/scalar/present", "Optional/scalar/empty-string-is-a-value", "hostile/Optional/scalar/wrong-type"], "providers": ["test_fullapi_ext_rust"], "consumers": ["py"], "summary": "echoOptional's return moved from `?tstr` to `result` in the Rust contract and nowhere else, so the two providers of one contract now answer different SHAPES and the case table still expects the old one", "measured": {"echoOptional(\"hi\")": "test_fullapi_ext_rust -> {\"success\": true, \"value\": \"hi\", \"error\": null}; test_fullapi_ext_cpp -> \"hi\". The cases expect \"hi\", so the cpp cell passes, the rust cell fails, and the provider differential fails with them.", "echoOptional(\"\")": "same split, with \"\" in the value slot.", "echoOptional(42)": "test_fullapi_ext_rust -> {\"success\": false, \"value\": null, \"error\": null} — the rejection is now reported INSIDE the result object; test_fullapi_ext_cpp -> dispatch_failed. The case expects dispatch_failed.", "the uncovered cell": "(result, method_return) was declared by the contract and exercised by no case — a `uncovered` row, which no registry entry can suppress. Closed by declaring `cells` on Optional/scalar/present rather than by adding a case, because the call that exercises it already exists."}, "note": {"_prose": "bullets", "parts": ["NOT PART OF THE failure/* WORK, and measured before any of it: with pristine 3046917 conformance files, the same fixtures and the same CLI, `conformance-matrix-ext` reports 73 pass / 6 fail / 3 xfail / 1 uncovered and exits 1. This entry and the `cells` key beside it are what make the gate reachable at all on this base; they are in their own commit so they can be reverted independently of the failure classes.", "The cause is visible in the sources, not inferred: test_fullapi_ext_rust.lidl now declares `method echoOptional(v: ?tstr) -> result`, with a long comment explaining why (`logos-qt-generator --backend consumer` refuses `-> ?T`, because null is already how a failed call is reported on that path). test_fullapi_ext_cpp is HEADER-FIRST — its contract is derived from src/test_fullapi_ext_cpp_impl.h, which still declares `std::optional<std::string> echoOptional(const std::optional<std::string>&)` and therefore still derives `-> ?tstr`. One contract, two providers, one of them updated.", "Nothing here has run this table against these fixtures before: logos-logoscore-py's flake.lock pins logos-test-modules a5605b9, and logos-test-modules' own CI (.github/workflows/ci.yml) has no conformance job. The drift was invisible in both repos and becomes visible on the first relock — the same shape of latency as the 44-cell one the failure-class work documents, and found the same way.", "Registered against the RUST provider rather than pinned with expect_by_provider: the two providers do not legitimately differ, one of them was not updated. Spelling it as a declared divergence would freeze a half-applied change into the contract."]}, "fix_is": "make the two providers agree — either update test_fullapi_ext_cpp_impl.h's echoOptional to the result-returning shape, or revert the Rust LIDL to `-> ?tstr` — and then move these three expectations to whichever shape wins. Not decided here: it is the ext contract's owner's call, and guessing it would bless one provider's encoding as the contract."}, {"id": "ext-optional-return-shape-through-the-qt-proxy", "cases": ["Optional/scalar/present", "Optional/scalar/empty-is-null", "Optional/scalar/empty-string-is-a-value", "hostile/Optional/scalar/wrong-type"], "providers": ["test_fullapi_ext_rust", "test_fullapi_ext_cpp"], "consumers": ["extqtproxy-sync", "extqtproxy-async"], "summary": "every echoOptional cell fails on the Qt consumer, and for TWO different reasons — one of which is that a `-> result` wrapper bound to a `-> ?tstr` provider answers success=false for every input, including a rejection", "correct_behaviour": "the two ext providers implement ONE contract, so echoOptional has one return shape and a consumer generated from that contract decodes every provider's answer. Until they agree there is no shape a bound wrapper can be generated for that is right for both.", "measured": {"what the proxy binds": "interfaces/full_api_ext.lidl declares `method echoOptional(v: ?tstr) -> result`, following test_fullapi_ext_rust.lidl — the file the driver is handed as --contract and the one this table computes coverage from (Optional/scalar/present declares the (result, method_return) cell explicitly). A bound wrapper needs ONE return type; picking the other spelling would have moved the failure to the other provider, not removed it.", "on test_fullapi_ext_rust": "the same answer py already gets and this table already registers under ext-optional-return-changed-on-one-provider: {\"success\": true, \"value\": \"hi\"} for present, {\"success\": true, \"value\": null} for empty-is-null, {\"success\": true, \"value\": \"\"} for the empty string, and {\"success\": false, \"value\": null} for the hostile one. Nothing new — the cells fail because the case table still expects the bare `?tstr` value, and the proxy faithfully carries the result object through.", "on test_fullapi_ext_cpp": "NEW, and the reason this entry exists rather than a `consumers` widening of the other one. The C++ ext provider is header-first and still derives `-> ?tstr`, so it sends a bare string. The generated Qt wrapper is decoding a `result`, cannot, and returns a DEFAULT-CONSTRUCTED LogosResult — {\"success\": false, \"value\": null, \"error\": null} — for every one of the four inputs. Measured on both call modes.", "the sharpest cell": "hostile/Optional/scalar/wrong-type. On py the provider's rejection reaches the caller as dispatch_failed (class E). Through the Qt proxy it arrives as a SUCCESSFUL call returning {\"success\": false, \"value\": null, \"error\": null} — the same value the three well-formed inputs produce. The class is gone, the error text is gone, and the rejection is indistinguishable from a decode failure and from a provider that legitimately answered false. The wrapper does record it: the sync signature ends `logos::CallError* err = nullptr`, and a caller who passes one is told. A caller who does not — which is every caller by default, and every forwarding proxy that has no channel to put it on — is not.", "what did NOT fail": "everything else. All eighteen record and typed-container cells are green on all six provider x consumer surfaces: Blob, Wrapper, Opt, [Blob], [Opt], {tstr: Blob}, {tstr: bstr}, {tstr: int}, {tstr: tstr}, {tstr: [bstr]}, [[int]] and [bstr]. Those are the widened Qt spellings — FullApiExt::Blob, QList<Blob>, QMap<QString, Blob>, QList<QByteArray>, QList<QList<qlonglong>>, QMap<QString, QList<QByteArray>>, std::optional<QString> in the record fields — and every one of them round-trips."}, "fix_is": {"_prose": "bullets", "parts": ["the same unresolved decision ext-optional-return-changed-on-one-provider names: make the two providers agree on echoOptional's return, then move these expectations to whichever shape wins. This entry adds the evidence that decides it — `-> ?tstr` was reverted to `-> result` on the Rust side for a reason that no longer holds (the qt-generator's `-> ?T` gate is retired, and lidlTypeToQt now maps `?T` to std::optional<T>), so `-> ?tstr` is emittable on the Qt surface today and is what the C++ provider already derives.", "INDEPENDENTLY of that: a Qt consumer wrapper that cannot decode a return should not spell the failure as a default-constructed value of the return type. For LogosResult that default is `success: false`, which is a value the contract can legitimately carry — so a decode failure impersonates a provider answer. The sink (`__derr`) and `logos::CallError` both know; the value does not."]}, "note": {"_prose": "bullets", "parts": ["Registered against BOTH providers on purpose. The rust half is the already-registered shape drift seen on a second surface; the cpp half is a different failure with the same root. Splitting them into two entries would suggest two decisions, and there is one.", "NOT cross-case pollution, MEASURED and not argued. The four cases run in the main block, so the pollution question is real; it was answered by an A/B with one variable — the same driver, the same modules, the same registry, the table re-run with `isolate: true` added to these four cases and to [bstr]/lenient-plain-string and nothing else changed. All 50 cells of those five cases are IDENTICAL between the two runs: same status, same actual value, on all three consumers and both providers. (The supporting reasoning also holds: every cell carries call_status=ok-sync / ok-async, and the sync and async halves are measured in separate daemons and agree exactly. But the A/B is the evidence — the last round of this work nearly registered four phantom cells that one `isolate: true` made behave.)"]}}, {"id": "ext-nested-int-range-unchecked-on-one-provider", "cases": ["[[int]]/out-of-signed-range"], "providers": ["test_fullapi_ext_rust"], "consumers": ["py"], "summary": "2^64-1 in an `int` slot two containers deep is accepted and echoed by test_fullapi_ext_rust; test_fullapi_ext_cpp rejects it by coordinate, and so does the Qt proxy", "correct_behaviour": "`int` is i64. The element loop that decodes `[[int]]` owes a range check at every element, at every depth — the same check the top-level `int` slots already get. Out of range is a rejection, not a value.", "measured": {"test_fullapi_ext_cpp / py": "REJECTS: {\"code\": \"dispatch_failed\", \"message\": \"expected signed integer in range at arg0[0][0], got number\", \"origin\": \"test_fullapi_ext_cpp\"} — the coordinate is named, which is why this entry's expectation is a measurement of one provider rather than a reading of the contract.", "test_fullapi_ext_rust / py": "ACCEPTS and echoes [[18446744073709551615]] unchanged. Not a rounding, not a wrap to -1: the exact value comes back, so the decode never went through an i64 at all.", "both providers, through the Qt proxy (sync and async)": "REJECTED, with the same sentence and the same coordinate, `origin: test_fullapi_ext_qtproxy`. The proxy's own cdylib dispatch decodes the argument into std::vector<std::vector<int64_t>> before it ever calls out, so the Rust provider is never offered the out-of-range number. The defect is therefore INVISIBLE on two of this table's three consumers — which is what makes it worth a case: the consumer differential prints it as py disagreeing with both proxy points, on the provider that has the hole.", "the neighbouring positive control": "echoNestedInts([[-9007199254740993, 9007199254740993]]) — both edges outside double precision, at depth 2 — round-trips identically on all six provider x consumer surfaces. The hole is the RANGE check, not the depth."}, "fix_is": "a range check in test_fullapi_ext_rust's `[[int]]` element decode, i.e. in the Rust backend's generated container loop rather than in the fixture — the fixture declares `[[int]]` and nothing else. It retires when this cell rejects on the Rust provider with the class the C++ one already reports.", "note": {"_prose": "bullets", "parts": ["Found by probing the nested widened containers directly rather than by the table, and then given a case so it has a forcing function. The case is stated as a plain `expect`, NOT as expect_by_provider: the two providers implement one contract and one of them is wrong, so declaring the divergence would freeze the hole into the contract.", "Registered against the RUST provider and the `py` consumer ONLY. The proxy consumers pass, and they must keep passing — if the day comes that a proxy cell here goes red, the proxy's own decode has lost the check too, and that is a second defect, not this one."]}}, {"id": "ext-bstr-leniency-canonicalised-by-the-proxy", "cases": ["[bstr]/lenient-plain-string"], "providers": ["test_fullapi_ext_rust"], "consumers": ["extqtproxy-sync", "extqtproxy-async"], "summary": "the one DECLARED provider divergence in this table stops diverging through a proxy — the hop canonicalises the plain string to tagged bytes before the provider ever sees it", "correct_behaviour": "the case says: a plain JSON string in a `[bstr]` slot is accepted leniently by test_fullapi_ext_rust and echoed back as a string, while test_fullapi_ext_cpp canonicalises it to tagged bytes. That is a statement about the two PROVIDERS' decoders, and it can only be measured by a caller that reaches a provider directly.", "measured": {"py": "providers DIFFER: ext_rust -> [\"hi\"], ext_cpp -> [{\"_bytes\": \"aGk\"}]. The declared divergence, unchanged.", "extqtproxy-sync / extqtproxy-async": "providers AGREE: both answer [{\"_bytes\": \"aGk\"}]. The proxy's own cdylib dispatch decodes the `[bstr]` argument into std::vector<std::vector<uint8_t>> — leniently, the C++ way — and re-encodes it as tagged bytes on the outbound call, so the Rust provider is never offered a plain string and its leniency is never exercised. The ext_cpp cell still passes because its expectation is already the canonical form; the ext_rust cell fails.", "the same divergence is DEEPER and WIDER than the one case says, measured by hand and NOT given cases here": "the registered case puts a plain string at depth 1 of [bstr]. Three more shapes do the same thing and none is in the table: `echoMapOfBytesLists({\"k\": [\"hi\"]})` — a plain string TWO containers deep — answers 0x6869 on ext_cpp and \"hi\" on ext_rust; `echoMapOfBytesLists({\"k\": [42]})` answers the two ASCII bytes 0x3432 on ext_cpp and the number 42 on ext_rust; `echoBytesList([[1, 2]])` answers 0x0102 on ext_cpp and [1, 2] on ext_rust. Through either proxy consumer all three answer the ext_cpp form, the same masking this entry describes. They are recorded and deliberately NOT turned into cases: the second one is not leniency but a COERCION — the number 42 became the bytes of its decimal spelling — and whether a bstr slot should coerce, reject, or keep being lenient is a decision about the contract that the ext table's owner has not made. Writing an expectation would make that decision by accident, and writing it as expect_by_provider would freeze the disagreement. What is not in doubt: the positive control passes everywhere — {\"k\": [0x0080ff, empty]} round-trips byte-identically on all six provider x consumer surfaces.", "the report says so on its own": "the DECLARED DIVERGENCES block prints `[bstr]/lenient-plain-string VARIES BY CONSUMER — py: providers DIFFER; extqtproxy-sync/async: providers agree — no longer diverges`. That line existed before this entry and had nothing to compare against; it is the thing worth reading here."}, "fix_is": "nothing in the system. This is a property of what a proxy cell CAN measure: a value that crosses two decoders is reported by the second one, so a leniency in the first is invisible unless the first is the one being called. The cell stays in the table for py, and is registered here for the surfaces that structurally cannot see it.", "note": {"_prose": "bullets", "parts": ["Deliberately NOT spelled as a per-consumer expectation. Widening expect_by_provider to an expect_by_consumer would pin `the proxy canonicalises` as a CONTRACT, and it is not one — it is what happens to be true of one decoder pair today. If the C++ decoder stopped being lenient, this cell would answer something else through the proxy and an expectation would still be green.", "The honest alternative is a `skip[]` entry — `this surface cannot express the cell` — and it was rejected because the surface DOES answer, with a defensible value. A skip would hide a real measurement; an xfail keeps it printed with the reason attached.", "NOT cross-case pollution, MEASURED: this case was in the same `isolate: true` A/B as the four Optional cells above (see ext-optional-return-shape-through-the-qt-proxy). Giving it a daemon of its own changed nothing — both proxy consumers still answer [{\"_bytes\": \"aGk\"}] on test_fullapi_ext_rust, and py still answers [\"hi\"]."]}}], "skip": [], "coverage_limits": [], "fixed": [{"ids": ["E1", "E2", "E3"], "fixed_by": "logos-protocol 362b03f — one canonical LIDL <-> JSON codec (#29)", "what": "bytes at depth mangled (E1), an empty nested bstr arriving as null (E2), and M1 seen through a record field (E3).", "verified": "all 22 registered cells went xpass on the re-pin, and the two ext providers now agree on every case — the differential went from 10 pass / 9 xfail to 19/19."}, {"ids": ["OPT1"], "fixed_by": "logos-lidl#7 (contract + accessors), logos-protocol#37 (Codec<std::optional<T>>), logos-rust-sdk#31 (Ty::Opt, Option<T>), logos-cpp-sdk#125 (cdylib gate, record codecs, header parser)", "what": "optionality is declared by the contract and read by NO generator, in any language", "verified": "conformance-matrix-ext, 39 cases x 2 providers x 1 consumer (py; the table had no consumer axis yet): 76 pass / 2 xfail / 0 fail. The six cells this entry covered went xpass, which is what forced it out of xfail.", "correct_behaviour": {"_prose": "bullets", "parts": ["`?T` is TWO-state: a value of T, or empty — never three-state, because one LIDL type maps to one type per language and every target has exactly one empty inhabitant (None / nullopt / invalid QVariant / undefined).", "DECODE is liberal in an optional slot: an omitted key and an explicit null both decode to empty. In a REQUIRED slot both stay errors (hostile/Optional/record/required-absent and /required-null pin that, and they pass today).", "ENCODE has ONE canonical form: empty is spelled by OMITTING the key where the slot is NAMED (a record field), and by null where the slot is POSITIONAL (method arg, return, event param) — a positional slot has no key to omit and the arity must never change. The round trip is therefore canonicalising, not identity.", "A present-but-wrong-typed value in an optional slot is STILL AN ERROR: optional widens the domain by exactly one inhabitant, it does not disable type checking. That is hostile/Optional/scalar/wrong-type, and it is the cell that separates a real implementation from `?T` = `any`."]}, "measured": {"logos-lidl": "parses BOTH spellings correctly and has done all along — parser.cpp:145 sets FieldDecl::optional for `? name: T`, parser.cpp:220 builds TypeExpr::Optional for `?T`, and json.cpp carries both across the AST boundary. The information is present at every backend's door; nothing opens it. `git grep '\\.optional'` across logos-rust-sdk, logos-cpp-sdk and logos-qt-sdk finds exactly one hit, in a rustgen unit test.", "logos-rust-sdk lidl-gen": "no TypeKind::Optional arm anywhere. `?tstr` falls to the catch-alls: rust_param_type gives the author `serde_json::Value`, and ty_descriptor gives the dispatch `args::Ty::Any` — i.e. no validation at all. The FIELD FLAG takes the opposite route: `? maybe: tstr` keeps ty=tstr, so the field is typed String, args::Ty::Record checks it as Tstr, and an absent key is rejected with `expected string at arg0.maybe, got null` (args.rs coerces a missing key to Value::Null, so absent and explicit-null are already indistinguishable there — which is the ONE part of the contract that already holds). Two spellings the spec calls equivalent, opposite behaviour.", "logos-rust-sdk rustgen record decode": "a SECOND gate behind the first: from_json is emitted as `o.get(\"f\")?.as_str()?`, whose `?` short-circuits the whole Option. Even if Ty::Record learned optionality, a record with an absent field would still decode to None as a unit.", "logos-rust-sdk to_json": "always writes the key, so a Rust peer cannot currently EMIT an absent field at all — the encode half of the contract has no expression in the generated code.", "logos-cpp-sdk cdylib backend": "EXECUTED against exactly these declarations. `?T` is a hard codegen reject — typeSupported() (lidl_gen_cdylib.cpp) has no TypeExpr::Optional arm, so `method echoOptional(v: ?tstr) -> ?tstr` fails the build with `Error: module not cdylib-eligible: method 'echoOptional': parameter 'v' has a type outside the cdylib-supported (Qt-free) subset` (exit 10). With that method removed, the record IS accepted and emitRecordCodecs ignores the flag completely: it emits `Codec<std::string>::from(j.contains(\"maybe\") ? j.at(\"maybe\") : nlohmann::json(), path + \".maybe\")`, i.e. absent becomes a typeError, and `out[\"maybe\"] = Codec<std::string>::to(v.maybe)` on the way back, i.e. the key is always written.", "logos-cpp-sdk impl-header parser": "EXECUTED. std::optional<T> is unrecognised and falls into the `Fallback: treat as opaque` arm, so a header-first C++ provider CANNOT EXPRESS an optional at all: `std::optional<std::string> maybe` derives as `maybe: any`, `std::optional<std::string> echoOptional(...)` derives as `method echoOptional(v: any) -> any`. Silently — no warning, and the derived contract then disagrees with the Rust provider's on a table whose whole purpose is that the two agree.", "logos-cpp-sdk / logos-qt-sdk emit": "lidl_emit_common.cpp maps TypeExpr::Optional to `QVariant` in both directions (lidlTypeToQtTypeName and lidlTypeToStd) — the untyped `any` spelling, which is exactly the modelling hostile/Optional/scalar/wrong-type exists to reject."}, "fix_is": {"_prose": "bullets", "parts": ["logos-lidl: `fieldIsOptional(f) = f.optional || f.type.kind == Optional` and `fieldValueType(f)`, so the two spellings are collapsed ONCE, at the front end, and no backend re-derives the equivalence (three re-derivations is three chances to disagree).", "logos-rust-sdk: Option<T> in rust_param_type/owned_type, `Ty::Opt` in args.rs, and a from_json that does not `?` on an absent optional key.", "logos-cpp-sdk: TypeExpr::Optional through the impl-header parser (std::optional<T> -> Optional), an Optional arm in typeSupported(), and Codec<std::optional<T>> in logos-protocol's logos_codec.h — absent OR null decodes to nullopt, nullopt encodes by omitting a named key.", "Qt is OUT OF SCOPE: logos-qt-generator had zero module.types handling, so records did not compile through --backend qt at all. (That backend has since been REMOVED from logos-qt-generator, which now emits only --backend consumer and --backend ui; the Qt-plugin provider glue comes from logos-plugin-qt's logos-qt-host-generator --backend cdylib.) Fixing that is a different piece of work and must not be smuggled in here."]}, "note": {"_prose": "bullets", "parts": ["Registered as ONE entry because it is one missing feature, not six defects. When it lands, all six cells go xpass together and this entry gets deleted in the same commit.", "Three cells in the family are deliberately NOT registered because they PASS today and must keep passing: hostile/Optional/record/wrong-type-in-optional-field, hostile/Optional/record/required-absent and hostile/Optional/record/required-null. They pass by accident — the flag is ignored, so the field is checked as a plain tstr — and the natural implementation of optional decoding, `o.get(\"maybe\").and_then(|v| v.as_str())`, would turn the first one red while turning the six above green. That is the shape of the lazy fix this family is built to catch."]}}], "unmeasurable": []}, "registry_used": {"ext-nested-int-range-unchecked-on-one-provider": [{"cell": "[[int]]/out-of-signed-range/test_fullapi_ext_rust/py", "status": "xfail", "case": "[[int]]/out-of-signed-range"}], "ext-bstr-leniency-canonicalised-by-the-proxy": [{"cell": "[bstr]/lenient-plain-string/test_fullapi_ext_rust/extqtproxy-async", "status": "xfail", "case": "[bstr]/lenient-plain-string"}, {"cell": "[bstr]/lenient-plain-string/test_fullapi_ext_rust/extqtproxy-sync", "status": "xfail", "case": "[bstr]/lenient-plain-string"}], "ext-optional-return-shape-through-the-qt-proxy": [{"cell": "Optional/scalar/present/test_fullapi_ext_rust/extqtproxy-async", "status": "xfail", "case": "Optional/scalar/present"}, {"cell": "Optional/scalar/present/test_fullapi_ext_rust/extqtproxy-sync", "status": "xfail", "case": "Optional/scalar/present"}, {"cell": "Optional/scalar/present/test_fullapi_ext_cpp/extqtproxy-async", "status": "xfail", "case": "Optional/scalar/present"}, {"cell": "Optional/scalar/present/test_fullapi_ext_cpp/extqtproxy-sync", "status": "xfail", "case": "Optional/scalar/present"}, {"cell": "Optional/scalar/empty-is-null/test_fullapi_ext_rust/extqtproxy-async", "status": "xfail", "case": "Optional/scalar/empty-is-null"}, {"cell": "Optional/scalar/empty-is-null/test_fullapi_ext_rust/extqtproxy-sync", "status": "xfail", "case": "Optional/scalar/empty-is-null"}, {"cell": "Optional/scalar/empty-is-null/test_fullapi_ext_cpp/extqtproxy-async", "status": "xfail", "case": "Optional/scalar/empty-is-null"}, {"cell": "Optional/scalar/empty-is-null/test_fullapi_ext_cpp/extqtproxy-sync", "status": "xfail", "case": "Optional/scalar/empty-is-null"}, {"cell": "Optional/scalar/empty-string-is-a-value/test_fullapi_ext_rust/extqtproxy-async", "status": "xfail", "case": "Optional/scalar/empty-string-is-a-value"}, {"cell": "Optional/scalar/empty-string-is-a-value/test_fullapi_ext_rust/extqtproxy-sync", "status": "xfail", "case": "Optional/scalar/empty-string-is-a-value"}, {"cell": "Optional/scalar/empty-string-is-a-value/test_fullapi_ext_cpp/extqtproxy-async", "status": "xfail", "case": "Optional/scalar/empty-string-is-a-value"}, {"cell": "Optional/scalar/empty-string-is-a-value/test_fullapi_ext_cpp/extqtproxy-sync", "status": "xfail", "case": "Optional/scalar/empty-string-is-a-value"}, {"cell": "hostile/Optional/scalar/wrong-type/test_fullapi_ext_rust/extqtproxy-async", "status": "xfail", "case": "hostile/Optional/scalar/wrong-type"}, {"cell": "hostile/Optional/scalar/wrong-type/test_fullapi_ext_rust/extqtproxy-sync", "status": "xfail", "case": "hostile/Optional/scalar/wrong-type"}, {"cell": "hostile/Optional/scalar/wrong-type/test_fullapi_ext_cpp/extqtproxy-async", "status": "xfail", "case": "hostile/Optional/scalar/wrong-type"}, {"cell": "hostile/Optional/scalar/wrong-type/test_fullapi_ext_cpp/extqtproxy-sync", "status": "xfail", "case": "hostile/Optional/scalar/wrong-type"}], "ext-optional-return-changed-on-one-provider": [{"cell": "Optional/scalar/present/test_fullapi_ext_rust/py", "status": "xfail", "case": "Optional/scalar/present"}, {"cell": "Optional/scalar/empty-string-is-a-value/test_fullapi_ext_rust/py", "status": "xfail", "case": "Optional/scalar/empty-string-is-a-value"}, {"cell": "hostile/Optional/scalar/wrong-type/test_fullapi_ext_rust/py", "status": "xfail", "case": "hostile/Optional/scalar/wrong-type"}], "OPT2": [{"cell": "Optional/scalar/empty-is-null/test_fullapi_ext_rust/py", "status": "xfail", "case": "Optional/scalar/empty-is-null"}, {"cell": "Optional/scalar/empty-is-null/test_fullapi_ext_cpp/py", "status": "xfail", "case": "Optional/scalar/empty-is-null"}], "pre-99-null-is-not-an-error": [{"cell": "failure/A/module-not-loaded/test_fullapi_ext_rust/extqtproxy-async", "status": "xfail", "case": "failure/A/module-not-loaded"}, {"cell": "failure/A/module-not-loaded/test_fullapi_ext_rust/extqtproxy-sync", "status": "xfail", "case": "failure/A/module-not-loaded"}, {"cell": "failure/A/module-not-loaded/test_fullapi_ext_rust/py", "status": "xfail", "case": "failure/A/module-not-loaded"}, {"cell": "failure/A/module-not-loaded/test_fullapi_ext_cpp/extqtproxy-async", "status": "xfail", "case": "failure/A/module-not-loaded"}, {"cell": "failure/A/module-not-loaded/test_fullapi_ext_cpp/extqtproxy-sync", "status": "xfail", "case": "failure/A/module-not-loaded"}, {"cell": "failure/A/module-not-loaded/test_fullapi_ext_cpp/py", "status": "xfail", "case": "failure/A/module-not-loaded"}, {"cell": "failure/C/unknown-method/test_fullapi_ext_rust/extqtproxy-async", "status": "xfail", "case": "failure/C/unknown-method"}, {"cell": "failure/C/unknown-method/test_fullapi_ext_rust/extqtproxy-sync", "status": "xfail", "case": "failure/C/unknown-method"}, {"cell": "failure/C/unknown-method/test_fullapi_ext_rust/py", "status": "xfail", "case": "failure/C/unknown-method"}, {"cell": "failure/C/unknown-method/test_fullapi_ext_cpp/extqtproxy-async", "status": "xfail", "case": "failure/C/unknown-method"}, {"cell": "failure/C/unknown-method/test_fullapi_ext_cpp/extqtproxy-sync", "status": "xfail", "case": "failure/C/unknown-method"}, {"cell": "failure/C/unknown-method/test_fullapi_ext_cpp/py", "status": "xfail", "case": "failure/C/unknown-method"}], "B-arity-overflow": [{"cell": "failure/B/arity/too-many/test_fullapi_ext_rust/extqtproxy-async", "status": "xfail", "case": "failure/B/arity/too-many"}, {"cell": "failure/B/arity/too-many/test_fullapi_ext_rust/extqtproxy-sync", "status": "xfail", "case": "failure/B/arity/too-many"}, {"cell": "failure/B/arity/too-many/test_fullapi_ext_rust/py", "status": "xfail", "case": "failure/B/arity/too-many"}, {"cell": "failure/B/arity/too-many/test_fullapi_ext_cpp/extqtproxy-async", "status": "xfail", "case": "failure/B/arity/too-many"}, {"cell": "failure/B/arity/too-many/test_fullapi_ext_cpp/extqtproxy-sync", "status": "xfail", "case": "failure/B/arity/too-many"}, {"cell": "failure/B/arity/too-many/test_fullapi_ext_cpp/py", "status": "xfail", "case": "failure/B/arity/too-many"}, {"cell": "failure/B/arity/too-many-zero-parameter/test_fullapi_ext_rust/extqtproxy-async", "status": "xfail", "case": "failure/B/arity/too- <script>
/* ── what this page is ────────────────────────────────────────────────────
   A single-table page embeds the payload for ONE contract, unchanged. A merged
   page embeds {"reports":[{ns,name,href,payload}, ...]} — the SAME payload
   objects, one per contract, never combined into one.

   Nothing here computes a number that spans contracts. The two tables are
   different measurements: different contracts, different case tables and
   registries, different PROVIDERS, different consumer axes. A blended count
   would hide which contract owns a failure, and the differential — providers
   compared to EACH OTHER — only means anything within one contract, because a
   case in one table has no counterpart in the other. */
const RAW = JSON.parse(document.getElementById("report-data").textContent);
const REPORTS = RAW.reports || [{ns: "", href: null,
  name: (RAW.meta.contract_name || "full_api"), payload: RAW}];
/* Produced by --merge, as opposed to "happens to carry one report". A merged
   landing page built when only ONE table produced a report must still name the
   contract it is showing — otherwise the table that failed simply vanishes and
   the page reads as if it were the whole story. */
const MERGED = !!RAW.reports;

/* The report currently being rendered. Rendering is synchronous and each
   report is emitted whole before the next begins, so a mutable "current"
   binding is enough and keeps every section function reading exactly the way
   it did when there was only ever one report. Nothing wired AFTER rendering
   (filters, deep links, the tab strip) reads it — they work off the DOM. */
let D = REPORTS[0].payload, NS = REPORTS[0].ns;
const nsid = s => NS ? NS + "-" + s : s;
const esc = s => String(s === undefined || s === null ? "" : s)
  .replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GLYPH = {pass:"\u00b7", xfail:"K", fail:"X", xpass:"^", skip:"~", "not-run":"?"};
const CLS   = {pass:"ok", xfail:"kn", fail:"bad", xpass:"xp", skip:"sk", "not-run":"bad"};
const ABBR  = {method_arg:"arg", "method_arg@0":"a0", "method_arg@1":"a1",
  "method_arg@2":"a2", method_return:"ret", event_param:"evt",
  "event_param@0":"e0", "event_param@1":"e1", "event_param@2":"e2",
  nested_in_container:"nest"};
/* There is deliberately NO value-to-text helper here. Every measured value is
   rendered in python (_render) and reaches this page as a string, because
   JSON.parse resolves numbers to doubles and would silently rewrite
   18446744073709551615 as ...52000 \u2014 the M1/M5/M6 defect, in the report that
   reports it. `clip` shortens text that is already the rendering. */
const clip  = (s, n) => s === undefined || s === null ? ""
  : (s.length > n ? s.slice(0, n-1) + "\u2026" : s);
const surfacesOf = P => {
  const out = [];
  P.meta.providers.forEach(p => P.meta.consumers.forEach(c => out.push(p + "|" + c)));
  return out;
};
/* Only the `test_fullapi_` stem comes off, NOT the `ext_` that follows it: on a
   merged page the ext contract's providers must not read as `cpp, rust` next to
   the full contract's `cpp, rust`. They are different modules, and the whole
   point of the page is that the two rows are different measurements. */
const shortProv = p => p.replace(/^test_fullapi_/, "");

/* ── the pills for ONE contract ───────────────────────────────────
   Always per contract, never summed across contracts. On a merged page these
   ride on the contract's own tab, so the split stays visible without a click. */
function pillsHtml(P) {
  const c = P.counts, n = k => c[k] || 0;
  const bits = [`<span class="pill pass">${n("pass")} pass</span>`];
  if (n("xfail")) bits.push(`<span class="pill known">${n("xfail")} known-broken</span>`);
  if (n("fail")) bits.push(`<span class="pill fail">${n("fail")} FAIL</span>`);
  if (n("xpass")) bits.push(`<span class="pill fail">${n("xpass")} xpass \u2014 registry stale</span>`);
  if (P.uncovered.length) bits.push(`<span class="pill fail">${P.uncovered.length} uncovered</span>`);
  if (n("skip")) bits.push(`<span class="pill dim">${n("skip")} skip</span>`);
  return bits.join(" ");
}
const isRed = P => (P.counts.fail || 0) + (P.counts.xpass || 0)
  + P.uncovered.length > 0;

/* ── grid ─────────────────────────────────────────────────────────────── */
function gridCell(cell) {
  if (cell.state === "n/a") return {html:'<span class="sk">.</span>', cls:"na"};
  if (cell.state === "uncovered") return {html:"--", cls:"unc c"};
  const t = cell.tally, parts = [];
  if (t.pass) parts.push(`<span class="ok">${t.pass}ok</span>`);
  [["fail","X","bad"],["xpass","^","xp"],["xfail","K","kn"],["skip","~","sk"],
   ["not-run","?","bad"]].forEach(([k, sfx, cls]) => {
    if (t[k]) parts.push(`<span class="${cls}">${parts.length?"+":""}${t[k]}${sfx}</span>`);
  });
  return {html: parts.join(""), cls: "c"};
}
function renderGrid() {
  const P = D.axis.positions, T = D.axis.types;
  let h = `<table class="grid"><tr><th class="ty">type</th>` +
    P.map(p => `<th title="${esc(p)}">${esc(ABBR[p] || p)}</th>`).join("") + `</tr>`;
  T.forEach(ty => {
    h += `<tr><td class="ty">${esc(ty)}</td>`;
    P.forEach(p => {
      const cell = D.grid[ty][p], g = gridCell(cell);
      const title = cell.state === "covered"
        ? cell.cases.join("\n")
        : (cell.state === "uncovered"
            ? "declared by the contract, exercised by no case"
            : "no such position for this type");
      h += `<td class="${g.cls}" data-ty="${esc(ty)}" data-pos="${esc(p)}" title="${esc(title)}">${g.html}</td>`;
    });
    h += `</tr>`;
  });
  h += `</table>`;
  const surf = D.meta.providers.length * D.meta.consumers.length;
  h += `<div class="legend">
    <b><span class="ok">n ok</span></b> = n cases green on all ${surf} provider &times; consumer surfaces &nbsp;&nbsp;
    <b><span class="swatch kn">+n K</span></b> = n cases with a registered known-broken cell (never counted as a pass) &nbsp;&nbsp;
    <b><span class="bad">n X</span></b> = failing &nbsp;&nbsp;
    <b><span class="xp">n ^</span></b> = xpass, the registry is stale<br>
    <b><span class="bad">--</span></b> = declared by the contract, <b>no case</b> &nbsp;&nbsp;
    <b><span class="sk">.</span></b> = no such position for this type &nbsp;&nbsp;
    <span class="sk">click any covered cell to jump to its cases</span>`;
  if (D.synthetic.length) {
    h += `<br><span class="sk">covered but not declared by the contract: ` +
      D.synthetic.map(c => esc(c[0] + " @ " + c[1])).join(", ") + `</span>`;
  }
  h += `</div>`;
  return h;
}

/* ── differential ─────────────────────────────────────────────────────── */
function renderDifferential() {
  const d = D.differential;
  let h = "";
  if (d.providers.length < 2) {
    h += `<p class="lede">One provider (<code>${esc(d.providers[0] || "-")}</code>) \u2014
      nothing to compare. This table has no differential column, which is a gap,
      not a design choice.</p>`;
  } else {
    h += `<div class="card"><h3>provider &nbsp;<code>${esc(d.providers[0])}</code>
      vs <code>${esc(d.providers[1])}</code></h3><table class="flat">`;
    const KLABEL = {behaviour: "by behaviour", agree: "no longer diverging",
                    identity: "by identity"};
    d.consumers.forEach(c => {
      const s = d.by_consumer[c];
      /* The breakdown, not just the count: "6 declared divergences" reads as
         six facts about the system, and two of them are a provider spelling
         its own name. */
      const k = {};
      D.diffs.filter(x => x.declared && (x.consumer || c) === c)
        .forEach(x => k[x.kind || "behaviour"] = (k[x.kind || "behaviour"] || 0) + 1);
      const detail = ["behaviour", "agree", "identity"].filter(x => k[x])
        .map(x => `${k[x]} ${KLABEL[x]}`).join("; ");
      h += `<tr><td>on ${esc(c)}</td>
        <td class="ok">${s.agree} agree</td>
        <td class="${s.differ.length ? "bad" : "sk"}">${s.differ.length} differ</td>
        <td class="sk">${s.declared.length ? "+" + s.declared.length +
          " declared, not compared" + (detail ? ` (${esc(detail)})` : "") : ""}</td></tr>`;
    });
    h += `</table></div>`;
  }
  if (d.consumers.length < 2) {
    h += `<div class="card"><h3>consumer <span class="tag">one point</span></h3>
      <p class="lede" style="margin:0">A cell proves a provider agreed with this
      client, not that two consumer surfaces agree with each other. A defect a
      consumer happens to undo is invisible from here.</p></div>`;
  } else {
    h += `<div class="card"><h3>consumer</h3><table class="flat">`;
    for (let i = 0; i < d.consumers.length; i++)
      for (let j = i + 1; j < d.consumers.length; j++)
        h += `<tr><td>${esc(d.consumers[i])} vs ${esc(d.consumers[j])}</td></tr>`;
    h += `</table></div>`;
  }
  const decl = D.diffs.filter(x => x.declared);
  if (decl.length) {
    h += `<h3 style="font-size:13.5px;margin:20px 0 4px">Declared divergences
      <span style="font-weight:400;color:var(--muted);font-size:12px">
      (<code>expect_by_provider</code>) \u2014 what each provider actually answered</span></h3>
      <p class="lede">The driver does not compare these: the divergence <em>is</em>
      the expectation. Shown because a declared divergence that quietly stopped
      diverging is worth seeing, and it carries no verdict and no exit code.</p>
      <table class="flat"><tr><th>case</th><th></th><th>answers</th></tr>`;
    /* Behaviour first, then the ones that stopped diverging, then identity.
       `kind` is decided in python (see _divergence_kind) so the page and the
       terminal cannot classify the same divergence differently. */
    const KIND = {behaviour: 0, agree: 1, identity: 2};
    [...decl].sort((a, b) => (KIND[a.kind] ?? 0) - (KIND[b.kind] ?? 0)).forEach(x => {
      /* One provider per line: the difference between two long values is
         usually deep inside them, and a side-by-side truncation hides it.
         When they AGREE there is no difference to place, so the value is
         stated once. */
      /* values_s, not values: pre-rendered in python so a uint64 answer is not
         re-encoded through a double on the way to the screen. */
      const ents = Object.entries(x.values_s || {});
      const vals = x.kind === "agree" && ents.length
        ? `<div><b>both</b> ${esc(clip(ents[0][1], 150))}</div>`
        : ents.map(([p, v]) =>
            `<div><b>${esc(shortProv(p))}</b> ${esc(clip(v, 150))}</div>`).join("");
      /* "Both providers now answer the same" is not good news and is not
         green: it means the per-provider split in the table is vestigial.
         Same shape of finding as an xpass, same colour. */
      const verdict = x.kind === "agree"
        ? `<span class="xp">NO LONGER DIVERGES</span>
           <div class="sk" style="font-size:11.5px">the declaration is vestigial</div>`
        : x.kind === "identity"
        ? `<span class="sk">DIFFER</span>
           <div class="sk" style="font-size:11.5px">by identity — true by construction</div>`
        : `<span class="kn">DIFFER</span>
           <div class="sk" style="font-size:11.5px">by behaviour</div>`;
      h += `<tr><td>${esc(x.case)}</td><td>${verdict}</td><td>${vals}</td></tr>`;
    });
    h += `</table>`;
  }
  return h;
}

/* ── cases ────────────────────────────────────────────────────────────── */
function stripHtml(cv) {
  return D.meta.consumers.map(c =>
    `<span class="g">` + D.meta.providers.map(p => {
      const e = cv.results[p + "|" + c] || {status: "not-run"};
      return `<span class="${CLS[e.status] || ""}" title="${esc(p + " / " + c + " \u2014 " + e.status)}">${GLYPH[e.status] || "?"}</span>`;
    }).join("") + `</span>`).join(" ");
}
function posLabel(cells, onlyType) {
  const p = cells.filter(c => !onlyType || c[0] === onlyType).map(c => c[1]);
  if (p.length === 2 && p[0] === "method_arg" && p[1] === "method_return") return "arg\u2192ret";
  return [...new Set(p)].map(x => ABBR[x] || x).join(",");
}
/* What the case sent and what the table expects, on ONE dim line. A green cell
   has nothing more to say than "it matched", and several hundred identical
   "it matched" blobs are what makes a report unreadable. Values appear in full
   only where something did not match. */
function callHtml(cv) {
  /* Every value here comes PRE-RENDERED from python (cv.render). JSON.parse
     puts numbers in doubles, so reading cv.args/cv.expect would print
     18446744073709552000 for the case that exists to prove
     18446744073709551615 survives. clip only — never re-encode. */
  const r = cv.render || {};
  if (!r.sent) return "";
  const sent = esc(clip(r.sent, 100));
  let want = "";
  if (r.want_kind === "identical")
    /* One expectation written N times is not N expectations. */
    want = `${esc(clip(r.want, 90))} <span class="where">(declared per provider, identical)</span>`;
  else if (r.want_kind === "identity")
    /* Values differing only by the provider's own name render identically
       once truncated; the full pair lives in the differential panel. */
    want = `<span class="where">each provider answers with its own name &mdash;
       see <a href="#${esc(nsid("differential"))}">differential</a></span>`;
  else if (r.want_kind === "per_provider")
    want = (r.want_pairs || []).map(([p, v]) =>
      `${esc(p)} ${esc(clip(v, 46))}`).join(" &nbsp;|&nbsp; ");
  else if (r.want_kind === "one")
    want = esc(clip(r.want, 90));
  return `<span class="call">${sent}${want ? ` <span class="arrow">&rarr;</span> ${want}` : ""}</span>`;
}
function valuesHtml(cv) {
  /* Identical outcomes on several surfaces print once, named: two providers
     failing the same way is one fact, not two. */
  const groups = new Map();
  Object.entries(cv.results).forEach(([k, e]) => {
    if (e.status === "pass") return;
    /* Grouped and displayed on the PRE-RENDERED text, for the same reason
       callHtml is: two values that differ only above 2^53 are one value once
       JSON.parse has been through them. */
    const sig = JSON.stringify([e.status, e.expected_s === undefined, e.expected_s, e.actual_s]);
    (groups.get(sig) || groups.set(sig, {e, keys: []}).get(sig)).keys.push(k);
  });
  let h = "";
  groups.forEach(({e, keys}) => {
    const where = keys.length === Object.keys(cv.results).length
      ? "all surfaces" : keys.join(", ");
    let t = `<b>${esc(e.status)}</b> <span class="where">${esc(where)}</span>`;
    if (e.expected_s !== undefined) t += `\n<b>expected</b> ${esc(clip(e.expected_s, 300))}`;
    t += `\n<b>got     </b> ${esc(clip(e.actual_s, 300))}`;
    h += `<pre class="val">${t}</pre>`;
  });
  return h;
}
function renderCases() {
  /* A case is listed under EVERY type it exercises: `arity/triple` has type
     "int,tstr,bstr", which is three types, one per slot — not one. */
  const byType = {}, anchored = new Set();
  D.cases.forEach(cv => [...new Set(cv.cells.map(c => c[0]))].forEach(ty =>
    (byType[ty] = byType[ty] || []).push(cv)));
  /* re-sorted per block: the payload's global order is keyed on case.type, which
     for a multi-argument case is a LIST of types */
  Object.values(byType).forEach(cs => cs.sort((a, b) =>
    a.tag_rank - b.tag_rank || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)));
  let h = `<p class="lede">Glyph groups are
    (<code>${D.meta.providers.map(shortProv).map(esc).join(", ")}</code>), one group per
    consumer: <code>${D.meta.consumers.map(esc).join(", ")}</code> &mdash;
    <span class="ok">&middot;</span> pass,
    <span class="kn">K</span> registered known-broken,
    <span class="bad">X</span> fail, <span class="xp">^</span> xpass.

    <b class="bad">&ne;</b> they do not, <b>&ne;*</b> the table declares the divergence.

  D.axis.types.forEach(ty => {
    const cs = byType[ty];
    if (!cs) return;
    let total = 0, ok = 0, broken = 0;
    cs.forEach(cv => Object.values(cv.results).forEach(e => {
      total++;
      if (e.status === "pass") ok++;
      if (["xfail", "fail", "xpass"].includes(e.status)) broken++;
    }));
    /* Same order as the grid's columns, so a type's position list reads the
       way its row does. Encounter order put `evt` first for `any` purely
       because the event case sorts first inside the block. */
    const positions = D.axis.positions.filter(p => cs.some(c =>
      c.cells.some(x => x[0] === ty && x[1] === p))).map(p => ABBR[p] || p).join(" ");
    h += `<div class="typeblock" data-type="${esc(ty)}">
      <div class="typehead"><span class="name">${esc(ty)}</span>
        <span class="meta">${cs.length} cases &middot; ${ok}/${total} cells pass` +
      (broken ? ` &middot; <span class="kn">${broken} known-broken</span>` : "") +
      `</span><span class="pos">${esc(positions)}</span></div>
      <table class="cases">`;
    cs.forEach(cv => {
      const d = cv.differential;
      const agree = d ? (d.agree ? "=" : (d.declared ? "\u2260*" : "\u2260")) : "";
      const kids = cv.known.map(k =>
        `<a class="kid" href="#${esc(nsid("reg-" + k))}">${esc(k)}</a>`).join("");
      const tags = cv.tags.map(t => `<span class="tagchip">${esc(t)}</span>`).join("");
      /* a case listed under three types must not carry the anchor three times */
      const anchor = anchored.has(cv.id) ? "" : ` id="${esc(nsid("case-" + cv.id))}"`;
      anchored.add(cv.id);
      h += `<tr class="c"${anchor} data-case="${esc(cv.id)}"
              data-search="${esc((cv.id + " " + cv.type + " " + cv.tags.join(" ") + " " + (cv.why||"")).toLowerCase())}"
              data-status="${esc(cv.rollup)}" data-ty="${esc(cv.type)}"
              data-pos="${esc(cv.cells.map(c => c[1]).join(" "))}">
        <td class="strip">${stripHtml(cv)}</td>
        <td class="diff ${d && !d.agree && !d.declared ? "ne" : ""}"
            title="do the two providers answer identically?">${agree}</td>
        <td class="pos">${esc(posLabel(cv.cells, ty))}</td>
        <td class="cid">${esc(cv.id)}${kids}${tags}
          ${callHtml(cv)}
          ${cv.why ? `<span class="why">${esc(cv.why)}</span>` : ""}
          ${valuesHtml(cv)}</td></tr>`;
    });
    h += `</table></div>`;
  });
  return h;
}

/* ── registry prose, rendered generically ─────────────────────────────── */
/* A registry entry has no fixed schema \u2014 the four in known.json carry four
   different key sets \u2014 so prose is rendered generically, by shape. */
const SKIP_KEYS = new Set(["id", "ids", "cases", "providers", "consumers",
  "per_case_providers", "per_case_consumers", "axis", "summary"]);
function proseHtml(entry, also) {
  let h = `<dl class="kv">`;
  Object.entries(entry).forEach(([k, v]) => {
    if (SKIP_KEYS.has(k) || (also && also.includes(k))) return;
    if (v === null || v === undefined) return;
    let body;
    if (v && typeof v === "object" && v._prose) {
      body = v._prose === "bullets"
        ? `<ul>${v.parts.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
        : v.parts.map(x => `<p>${esc(x)}</p>`).join("");
    } else if (Array.isArray(v)) {
      body = `<ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    } else if (typeof v === "object") {
      body = `<ul>${Object.entries(v).map(([kk, vv]) =>
        `<li><code>${esc(kk)}</code> \u2014 ${esc(vv)}</li>`).join("")}</ul>`;
    } else body = esc(v);
    h += `<dt>${esc(k)}</dt><dd>${body}</dd>`;
  });
  return h + `</dl>`;
}
function renderRegister() {

      `</dd><dt>providers</dt><dd><code>${esc((e.providers||[]).join(", "))}</code></dd>` +

function renderHistory() {

/* Every section is rendered behind this. The page is assembled as ONE
   innerHTML assignment, so before this guard a single throw anywhere in any
   section left <main> completely empty — a blank report that looks like "no
   data" rather than "a bug in one panel". Now the failing panel says so and
   the rest of the report still renders. */
function safeSection(name, fn) {
  try { return fn(); }
  catch (e) {
    return `<p class="lede">This section failed to render: <code>${esc(name)}: ${esc(e.message)}</code>.
      The rest of the report is unaffected; the data is intact in the jsonl.</p>`;
  }
}
function renderAll() {
  let h = `<p class="lede">Completeness, reachable but not the landing view: one row per
    (case, provider, consumer) cell, ${D.meta.cell_count} in total.</p>
    <details><summary>show every cell</summary><table class="flat">
    <tr><th>status</th><th>type</th><th>position</th><th>provider</th><th>consumer</th>
    <th>case</th><th>known</th></tr>`;
  const surfaces = surfacesOf(D);
  D.cases.forEach(cv => surfaces.forEach(k => {
    const e = cv.results[k];
    if (!e) return;
    h += `<tr><td class="${CLS[e.status]}">${esc(e.status)}</td><td>${esc(cv.type)}</td>
      <td>${esc(cv.position)}</td><td>${esc(e.provider)}</td><td>${esc(e.consumer)}</td>
      <td>${esc(cv.id)}</td><td class="kn">${esc(e.known || "")}</td></tr>`;
  }));
  return h + `</table></details>`;
}

/* ── one contract's panel ─────────────────────────────────────────────────
   Exactly the report that has always been rendered here, with its section ids
   namespaced so several contracts can share a page without colliding. Every
   section is behind safeSection(): the panel is written with ONE innerHTML
   assignment, so an uncaught throw anywhere in it would leave the whole page
   empty — and on a merged page that would take the OTHER contract's report
   down with it. A broken panel says so and nothing else moves. */
function renderContract(R) {
  D = R.payload;
  NS = R.ns;
  const m = D.meta;
  const link = R.href
    ? ` &middot; <a href="${esc(R.href)}">standalone page</a>` +
      (String(R.href).endsWith("/")
        ? ` &middot; <a href="${esc(R.href)}matrix.jsonl">jsonl</a>
            &middot; <a href="${esc(R.href)}matrix.txt">text</a>` : "")
    : "";
  return `<div class="contract" data-ns="${esc(R.ns)}">
  <p class="lede">Contract <code>${esc(m.contract_name || "full_api")}</code> &middot;
    ${m.case_count} cases &times; ${m.providers.length} provider(s)
    &times; ${m.consumers.length} consumer(s) = ${m.cell_count} cells &middot;
    generated ${esc(m.generated)}${link}<br>
    providers <code>${m.providers.map(esc).join("</code> <code>")}</code> &middot;
    consumers <code>${m.consumers.map(esc).join("</code> <code>")}</code> &middot;
    transport LocalSocket/QtRO</p>
  <section id="${esc(nsid("grid"))}"><h2>Type &times; position<span class="sub">what this system
    guarantees, per type</span></h2>${safeSection("renderGrid", renderGrid)}</section>
  <section id="${esc(nsid("differential"))}"><h2>Differential<span class="sub">this contract's
    providers compared to each other, independently of <code>expect</code></span></h2>
    ${safeSection("renderDifferential", renderDifferential)}</section>
  <section id="${esc(nsid("cases"))}"><h2>Cases<span class="sub">what was actually verified</span></h2>
    ${safeSection("renderCases", renderCases)}</section>
  <section id="${esc(nsid("register"))}"><h2>Known-broken register<span class="sub">every amber cell,
    and its claim</span></h2>${safeSection("renderRegister", renderRegister)}</section>
  <section id="${esc(nsid("notmeasured"))}"><h2>Not measured<span class="sub">on the record, not
    silently absent</span></h2>${safeSection("renderNotMeasured", renderNotMeasured)}</section>
  <section id="${esc(nsid("history"))}"><h2>Registry history<span class="sub">closed entries, and the
    guards they left behind</span></h2>${safeSection("renderHistory", renderHistory)}</section>
  <section id="${esc(nsid("all"))}"><h2>All cells</h2>${safeSection("renderAll", renderAll)}</section>
  <div class="foot">Generated by <code>run_matrix.py --report</code>. Case table and
    registry: <code>${esc((m.paths || {}).cases || "")}</code>,
    <code>${esc((m.paths || {}).known || "")}</code>. This report measures nothing; every
    number is a re-arrangement of one the driver produced.</div></div>`;
}

/* ── the contracts, side by side but never added up ───────────────────────
   The one thing a merged page must say out loud, because the layout invites
   the opposite reading: these are two measurements, not two halves of one. */
function renderContracts() {
  const n = REPORTS.length;
  const head = n === 1 ? `1 contract`
    : `${n} contracts, ${n} measurements`;
  const sub = n === 1
    ? `&mdash; the merged report, with one table present`
    : `&mdash; not ${n === 2 ? "two halves" : "parts"} of one number`;
  let h = `<div class="banner"><h2>${head}
    <span class="sub" style="font-weight:400;font-size:12.5px;color:var(--muted)">
    ${sub}</span></h2>
    <p>Each row below is its own run: its own contract, its own case table and
    registry, its own <b>providers</b>, its own consumer axis. Nothing on this page
    is summed across them, and no cell in one table has a counterpart in another
    to be compared with. The <a href="#${esc(REPORTS[0].ns)}-differential">differential</a>
    is a comparison of the providers <em>of one contract</em>; a cross-contract
    differential would be a comparison of unrelated things and is not computed.</p>
    <table class="flat">
    <tr><th>contract</th><th>providers</th><th>consumers</th><th>cases</th>
      <th>cells</th><th>result</th><th></th></tr>`;
  REPORTS.forEach(R => {
    const P = R.payload, m = P.meta;
    h += `<tr><td><a href="#${esc(R.ns)}-grid" data-goto="${esc(R.ns)}"><b>${esc(R.name)}</b></a></td>
      <td>${(m.providers || []).map(p => esc(shortProv(p))).join(", ")}</td>
      <td>${(m.consumers || []).map(esc).join(", ")}</td>
      <td>${esc(m.case_count)}</td><td>${esc(m.cell_count)}</td>
      <td>${pillsHtml(P)}</td>
      <td>${R.href ? `<a href="${esc(R.href)}">standalone</a>` : ""}</td></tr>`;
  });
  h += `</table>`;
  const tables = REPORTS.map(R =>
    `<code>${esc((R.payload.meta.paths || {}).cases || "?")}</code>`);
  h += `<p style="margin:10px 0 0;color:var(--dim);font-size:11.5px">case tables:
    ${tables.join("<br>")}</p></div>`;
  return h;
}

/* A contract whose panel throws OUTSIDE any section still gets a panel — an
   empty one, saying so. Falling back to bare text would leave the tab pointing
   at nothing, and the tab switcher would then hide every OTHER contract to show
   a panel that does not exist: one broken contract blanking the page, by a
   different route than the one safeSection closed. */
function safePanel(R) {
  try { return renderContract(R); }
  catch (e) {
    return `<div class="contract" data-ns="${esc(R.ns)}">
      <p class="lede">This contract's report failed to render:
      <code>${esc(R.name)}: ${esc(e.message)}</code>. Every other contract on
      this page is unaffected, and the data is intact in the jsonl.</p></div>`;
  }
}

/* ── assemble ─────────────────────────────────────────────────────────── */
document.getElementById("main").innerHTML =
  (MERGED ? `<section id="contracts">${
    safeSection("renderContracts", renderContracts)}</section>` : "") +
  REPORTS.map(safePanel).join("");

/* filters: text, plus the four questions worth asking of a case list.

   Declared BEFORE the tab strip, because activate() calls applyFilters() and
   `let` sits in a temporal dead zone until its declaration is evaluated. With
   this block below activate(), the very first activate() threw a
   ReferenceError inside applyFilters and took every listener after it with
   it: the tabs still switched (their listeners were already attached) and the
   chips, the search box and the grid-cell jumps did nothing at all. The page
   looked completely fine. */
let FILTER = "all";
const KEEP = {
  all: () => true,
  notgreen: tr => tr.dataset.status !== "pass",
  known: tr => tr.dataset.status === "xfail" || !!tr.querySelector(".kid"),
  hostile: tr => /hostile|adversarial/.test(tr.dataset.search),
};
function applyFilters() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll("table.cases tr.c").forEach(tr => {
    const ok = KEEP[FILTER](tr) && (!q || tr.dataset.search.includes(q));
    tr.classList.toggle("hide", !ok);
  });
  document.querySelectorAll(".typeblock").forEach(b => {
    b.classList.toggle("hide", !b.querySelector("tr.c:not(.hide)"));
  });
}
document.getElementById("q").addEventListener("input", applyFilters);
document.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  FILTER = btn.dataset.f;
  applyFilters();
}));

/* One tab per contract, carrying that contract's OWN counts. A single-table
   page has one report and no tab strip; its pills sit in the header exactly
   where they always did. */
try {
  if (MERGED) {
    document.getElementById("tabs").innerHTML = REPORTS.map(R => {
      const m = R.payload.meta || {};
      return `<button class="tab" data-ns="${esc(R.ns)}">
        <span class="tname">${esc(R.name)}</span>
        <span class="tmeta">${esc(m.case_count)} cases &middot;
          ${(m.providers || []).length} providers &times;
          ${(m.consumers || []).length} consumers</span>
        <span class="tpills">${safeSection("pills", () => pillsHtml(R.payload))}</span>
      </button>`;
    }).join("");
    document.getElementById("navtop").classList.remove("hide");
    /* An aggregate that cannot hide an owner: it NAMES the contracts that are
       red. A bare "N pass" across both would be exactly the number this page
       refuses to print. */
    const red = REPORTS.filter(R => isRed(R.payload)).map(R => R.name);
    document.getElementById("pills").innerHTML = red.length
      ? `<span class="pill fail">FAIL in ${red.map(esc).join(", ")}</span>`
      : `<span class="pill dim">${REPORTS.length} contract${
          REPORTS.length === 1 ? "" : "s"}, measured separately</span>`;
  } else {
    document.getElementById("pills").innerHTML = pillsHtml(REPORTS[0].payload);
  }
} catch (e) {
  /* The tab strip IS the merged page's navigation. A throw here used to take
     every listener below it with it, leaving a page that renders and does
     nothing. */
  document.getElementById("pills").innerHTML =
    `<span class="pill fail">header failed: ${esc(e.message)}</span>`;
}

function activate(ns) {
  const have = [...document.querySelectorAll(".contract")].map(p => p.dataset.ns);
  /* Never hide every panel to show one that is not there. */
  if (!have.includes(ns)) ns = have[0];
  document.querySelectorAll(".contract").forEach(p =>
    p.classList.toggle("hide", MERGED && p.dataset.ns !== ns));
  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("on", b.dataset.ns === ns));
  /* The header nav is shared, so it retargets at the contract on screen. */
  document.querySelectorAll("nav a[data-sec]").forEach(a =>
    a.href = "#" + (ns ? ns + "-" : "") + a.dataset.sec);
  applyFilters();
}
document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => activate(b.dataset.ns)));
document.querySelectorAll("[data-goto]").forEach(a =>
  a.addEventListener("click", () => activate(a.dataset.goto)));
activate(REPORTS[0].ns);

/* grid cell -> jump to the type block, WITHIN this contract's panel */
document.querySelectorAll(".contract").forEach(panel => {
  panel.querySelectorAll("td.c").forEach(td => td.addEventListener("click", () => {
    const el = panel.querySelector(`.typeblock[data-type="${td.dataset.ty}"]`);
    if (!el) return;
    el.classList.remove("folded");
    el.scrollIntoView({behavior: "smooth", block: "start"});
  }));
});

/* a type block folds away, so the type headers alone are a scannable index */
document.querySelectorAll(".typehead").forEach(th =>
  th.addEventListener("click", () => th.parentElement.classList.toggle("folded")));

/* deep links: #case-<id> and #reg-<id> land on a row even inside a folded
   block — and, on a merged page, even inside the contract that is not the one
   on screen: the link switches to it. */
function revealHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  const el = document.getElementById(id);
  if (!el) return;
  const panel = el.closest(".contract");
  if (panel) activate(panel.dataset.ns);
  const block = el.closest(".typeblock");
  if (block) block.classList.remove("folded");
  el.scrollIntoView({block: "center"});
}
window.addEventListener("hashchange", revealHash);
revealHash();
</script>
</body>
</html>
