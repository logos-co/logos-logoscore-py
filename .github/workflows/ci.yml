name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix and set up cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          extra-nix-config: |
            experimental-features = nix-command flakes

      - name: Build package
        run: nix build --print-build-logs

      - name: Run unit tests
        run: nix build '.#checks.${{ matrix.arch }}.unit' --print-build-logs

      # The integration suite is replicated across three transports
      # (`local`, `tcp`, `tcp_ssl`). Each is its own flake check
      # (`integration-<transport>`), built sequentially below.
      # `local` runs first because it's the fastest and exercises the
      # most code paths (no port allocation, no TLS handshake) — if
      # that's red, the network paths almost certainly are too.
      # tcp and tcp_ssl follow so a regression in transport plumbing
      # surfaces under its own name in the workflow log.
      #
      # Why sequential rather than a third matrix axis: the heavy
      # cost of these jobs is the upstream nix build (logosctl CLI +
      # test modules). Each matrix entry would re-pull / re-realise
      # the same closure on a cold runner. Running all three transports
      # in one job amortises that closure across them.
      - name: Run integration tests (local)
        run: nix build '.#checks.${{ matrix.arch }}.integration-local' --print-build-logs

      - name: Run integration tests (tcp)
        run: nix build '.#checks.${{ matrix.arch }}.integration-tcp' --print-build-logs

      - name: Run integration tests (tcp_ssl)
        run: nix build '.#checks.${{ matrix.arch }}.integration-tcp_ssl' --print-build-logs

      # Docker smoke tests live in their own directory
      # (`tests/logosctl/docker_smoke/`) because they can't run inside the nix
      # sandbox (no docker socket), so this is the only place they run.
      #
      # Step 1 builds the `logosctl:smoke-portable` image (a multi-stage
      # `docker build` that runs `nix build` inside a `nixos/nix` container).
      # Step 2 runs pytest via `nix develop` so python + pytest are on PATH
      # and PYTHONPATH points at the local source tree.
      #
      # buildx is set up first so the GHA cache backend (`type=gha`) works;
      # `mode=max` caches the expensive in-image `nix build` layer too.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker smoke image
        env:
          BUILDX_CACHE_FROM: type=gha,scope=logosctl-smoke-${{ matrix.arch }}
          BUILDX_CACHE_TO: type=gha,mode=max,scope=logosctl-smoke-${{ matrix.arch }}
        run: ./tests/logosctl/docker_smoke/build_smoke_image.sh

      - name: Run docker smoke tests
        run: |
          nix develop --command pytest tests/logosctl/docker_smoke -v
