case": "event/[bool]", "consumer": "qtproxy-sync", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/[bool]", "consumer": "qtproxy-async", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/[any]", "consumer": "py", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/[any]", "consumer": "qtproxy-sync", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/[any]", "consumer": "qtproxy-async", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/{tstr:any}", "consumer": "py", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/{tstr:any}", "consumer": "qtproxy-sync", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/{tstr:any}", "consumer": "qtproxy-async", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/arity/triple", "consumer": "py", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/arity/triple", "consumer": "qtproxy-sync", "declared": false, "agree": true, "status": "pass", "known": null}, {"case": "event/arity/triple", "consumer": "qtproxy-async", "declared": false, "agree": true, "status": "pass", "known": null}], "uncovered": [], "synthetic": [["bstr", "nested_in_container"]], "registry": {"xfail": [{"id": "M4-residual", "cases": ["adversarial/any/pending-call-canonical"], "providers": ["test_fullapi_cpp", "test_fullapi_rust"], "consumers": ["py", "qtproxy-sync", "qtproxy-async"], "summary": "a CANONICAL-shape forgery of the deferred-call sentinel still hijacks a call", "measured": {"echoAny({\"__logos_pending_call__\": \"lc-0\"})": "TimeoutExpired on both providers — the call hangs for the full timeout in a nested event loop", "through the Qt consumer": "TimeoutExpired too, on both providers and in BOTH call modes. Added to `consumers` only after measuring: the entry was written when `py` was the only surface, and the driver now refuses an entry that does not say which surfaces it covers."}, "note": {"_prose": "bullets", "parts": ["This replaces M4 rather than closing it. The shape check that landed rejects a map with extra keys or a non-string value, which is what M4 actually measured — but a one-key map whose value is a string IS the sentinel. No detector can separate them, because there is nothing to separate.", "Worse than a hang, and the reason this stays registered rather than being written off: call ids are a per-object counter starting at 0, so a forged \"lc-0\" can collide with a GENUINE in-flight completion and steal its result.", "The in-band design itself is a real constraint, stated at logos_rpc_status.h:24-27 — the dispatch slot returns a single QVariant, so 'deferred' has nowhere out-of-band to live without an ABI break. Closing this needs that channel, not a better guard."]}, "fix_is": "an out-of-band way to signal deferral (a second return channel or a protocol-major dispatch signature), not a stricter predicate"}, {"id": "M3", "cases": ["adversarial/{tstr:any}/_bytes-key"], "providers": ["test_fullapi_cpp", "test_fullapi_rust"], "consumers": ["qtproxy-sync", "qtproxy-async"], "summary": "a one-key `_bytes` map reaching a Qt-typed map slot is reinterpreted as bytes and arrives EMPTY", "measured": {"echoMap({\"_bytes\": \"aGk\"}) direct (py)": "{\"_bytes\": \"aGk\"} — round-trips untouched", "echoMap({\"_bytes\": \"aGk\"}) through the Qt consumer": "{} — on both providers, in both call modes", "echoAny({\"_bytes\": \"aGk\"}) through the Qt consumer": "{\"_bytes\": \"aGk\"} — GREEN, and that is not evidence of health; see below", "fireAnyEvent({\"_bytes\": \"aGk\"}) then getLastEvent()": "`anyEvent:b:6869` — the proxy's type-tagged rendering says QByteArray where the sender put a map. The collision, observed directly on the consumer callback."}, "why_the_two_cells_disagree": {"_prose": "bullets", "parts": ["The collision itself is SYMMETRIC: `nlohmannToQVariant` turns the one-key tagged map into a QByteArray, and encoding a QByteArray back out produces the same tagged map. So on an `any` slot the round trip is its own inverse and python sees the value it sent — the cell is green and proves nothing about the type in between.", "It becomes LOSSY the moment the receiving slot is typed. `echoMap` declares QVariantMap, the incoming value is now a QByteArray, and coercing one to the other yields an empty map. The payload is gone, not merely retyped.", "That is why the previous entry read as unmeasurable: it was looking at the `any` cell. The typed-map cell is the observation, and the event rendering is the direct confirmation."]}, "why_it_is_not_being_fixed": {"_prose": "bullets", "parts": ["Inherent, and already documented in-tree at logos_codec.h: a genuine one-key map named `_bytes` whose value is a string is indistinguishable from bytes.", "Closing it means changing the C ABI's data model (JSON-in-strings), a protocol-MAJOR change invalidating every built module binary across ~8 repos. Unlike M6, no cheap change makes the system correct here.", "It is NOT a wire-format question: qt_remote already carries QByteArray natively as a QVariant metatype and the collision still happens — it is in the type-erased converters, upstream of every wire."]}, "fix_is": "a data model where a byte string is not spelled as a map, not a stricter predicate — the shape that would be checked IS the encoding", "attributed_by_measurement_not_inference": "the same case replayed through test_fullapi_proxy (apiStyle=lp) answers {\"_bytes\": \"aGk\"} — the map survives an identically-shaped proxy hop on a non-Qt client. So the loss is the Qt conversion, not the extra hop, which is what the old entry predicted and what is now measured.", "registered_here_rather_than_unmeasurable_because": "it now has a red cell with a coordinate. `unmeasurable` was accurate for as long as the only consumer was one that decodes the tag itself; a Qt-typed consumer surface changed that, which is exactly what the entry's own `to_make_it_measurable` line asked for."}], "skip": [{"cases": ["bstr/*"], "consumers": ["qml"], "reason": "unsupported-by-surface", "note": "JavaScript has no byte-string literal; the QML bridge excludes bstr by design"}, {"cases": ["uint/boundary/*", "event/uint/boundary"], "consumers": ["qml"], "reason": "unsupported-by-surface", "note": {"_prose": "text", "parts": ["A JavaScript Number is a double, so a LIDL `uint` above 2^53 can never be exact once it reaches QML (logos-view-module-runtime LogosQmlBridge re-emits the QVariantList straight into JS). This is a contract limit of that consumer surface, not a defect, and no fix on the C++ side changes it. Recorded because it was previously nowhere: the only qml skip was for bstr, so the numeric limit looked like an untested gap rather than a known boundary. The pattern was `uint/boundary` and matched NOTHING: the case was split into uint/boundary/above-2^53 and uint/boundary/max and this entry was not updated. Nobody noticed because the driver never read skip[] at all — the first thing the second consumer forced was reading it, and the first thing reading it found was this. A registry that is not executed decays into a comment."]}}], "coverage_limits": [{"axis": "consumer", "status": "PARTLY CLOSED — three consumer points now, was one", "note": {"_prose": "text", "parts": ["History, kept because the reasoning is the reusable part: the matrix had ONE consumer driver (`py`), so a cell proved a provider agreed with the python client, not that two consumer surfaces agreed with each other. That hid a real defect — the event bridge failing to decode tagged bytes into a QByteArray was invisible because the undecoded map round-trips and the py client decodes the tag itself; it took asserting the bridge directly (logos-protocol test_event_payload_fidelity.cpp) to see it. It also recorded, correctly, that adding the existing C++/Rust proxies would NOT close the hole: both are lp/Rust-client consumers, so they share the py blind spot for the Qt-typed path.", "Now measured, not argued. The axis runs py + qtproxy-sync + qtproxy-async. Two findings came straight out of it: M3 became measurable (and is now an ordinary xfail), and Q1 — the Qt dispatch coercing hostile arguments — was not previously known at all. The live cell counts are in the register rather than restated here, because a count written into prose goes stale silently and this block is reproduced verbatim in every report.", "What is STILL open on this axis: * QML. No driver replays cases.json through the LogosQmlBridge, and the two skip[] entries describe exactly that surface. * The cdylib/Rust proxy. Buildable and driveable by the same --proxy-consumer flag; not wired in. * The lp proxy. Measured here for ATTRIBUTION (it is what proves Q1 and M3 are the Qt style rather than the extra hop) but not carried as a standing consumer: it has 2 divergent cases of its own that would need registry entries first. * The ext table (ext-cases.json) still has no proxy at all, so every one of its cells remains single-consumer. It does now run BOTH providers, so it has a provider differential; the consumer axis is the half still missing."]}, "how_the_qt_consumer_point_is_selected_now": {"_prose": "bullets", "parts": ["Recorded because the note above describes it by its old shape. The qtproxy point used to be `type: core` with NO `interface` key — one decision selecting the Qt surface for the module's provider AND consumer sides at once, and the last caller of the generator's removed `--provider-header` mode.", "The two axes are separate keys now: `interface: \"universal\"` makes it a header-first cdylib provider, and `codegen.consumer_api_style: \"qt\"` keeps its dependency wrappers Qt-typed. The consumer point the matrix measures is unchanged in kind; only the way it is declared is. Dropping the second key would silently move this point onto the lp surface test_fullapi_proxy already covers, which is exactly the collapse this axis exists to prevent."]}}, {"axis": "transport", "note": {"_prose": "text", "parts": ["Every cell is measured over LocalSocket/QtRO: run_matrix.py builds the daemon with no `transports=`, and there is no flag to change it. The plain (tcp/tcp_ssl) wire is unreachable from this table. That mattered for uint: RpcValue's variant had no unsigned alternative (logos-protocol cpp/implementations/plain/rpc_value.h), so a uint64 above int64max wrapped to -1 there — a DIFFERENT wrong answer than the one M6 described, which this matrix would not have matched. Fixed in the same logos-protocol PR as M6, but found only by reading the code: no cell here could reach it. The regression guard for it lives where it can run — logos-logoscore-py's integration table, which now carries 2^63, 2^64-1 and 2^53+1 and is replayed over local, tcp and tcp_ssl."]}}], "fixed": [{"ids": ["M1", "M1b", "M5"], "fixed_by": "logos-protocol 362b03f — one canonical LIDL <-> JSON codec (#29), pinned here via logos-cpp-sdk 3d322bd / logos-module-builder / logos-logoscore-cli", "what": "a uint64 above int64max degrading to a double once nested (M1/M1b), and a bstr nested in a container being UTF-8 mangled (M5). Both were the same root cause: the Qt and plain-wire paths each had their own conversion, and neither preserved a value whose type the container did not declare.", "verified": "11 cells went xpass on the re-pin and the entries were deleted; the cases stay in cases.json as ordinary green cells, which is the point — they are now regression guards."}, {"ids": ["M6"], "fixed_by": "logos-protocol — setEventListenerStdBridge now parses with nlohmann and converts via logos::nlohmannArgsToQVariantList, the same helper callMethodStdBridge uses", "what": "a uint64 above int64max degrading to a double on the EVENT path (uintEvent(2^64-1) -> 1.8446744073709552e+19) while the method path was exact.", "why_it_was_missed_by_the_codec_work": {"_prose": "bullets", "parts": ["M6 was NOT the residue of M1 in the sense the old entry claimed. #29 converged six copies of the VALUE codec; this was a seventh conversion living in an ADAPTER — the universal->Qt event callback bridge — which nothing in that PR's scope touched.", "The lossy call was QJsonDocument::fromJson + QJsonValue::toVariant. Qt 6 backs QJsonValue with QCborValue, so integers up to int64 survived it; ONLY a uint64 above int64max had no integral representation and fell back to double. That narrowness is why it read as a deep wire problem rather than a one-line parser choice.", "It is also not the module providers' path: a Qt provider stores its event callback verbatim and a cdylib provider's generated emitTrampoline already used nlohmannArgsToQVariantList. The one live caller is the logoscore daemon's CoreServiceImpl, which forwards every watched module event — which is exactly why C++ and Rust providers measured identically."]}, "verified": "both cells went xpass with the exact value 18446744073709551615; 11 new unit tests in logos-protocol tests/protocol/test_event_payload_fidelity.cpp pin the bridge directly (210/210)."}, {"ids": ["bytes-on-the-event-path"], "fixed_by": "the same change", "what": "canonical tagged bytes {\"_bytes\": ...} were not decoded by the event bridge — they arrived as a QVariantMap where the method path yields a QByteArray.", "note": {"_prose": "bullets", "parts": ["Never registered as a defect because it was invisible from python: the undecoded map round-trips to JSON and the python client decodes the tag itself, so the matrix saw correct bytes. A C++ or QML event subscriber did not.", "Found by asserting the bridge's behaviour directly instead of only end-to-end — an end-to-end-only matrix cannot see a defect that a downstream layer happens to undo."]}}, {"ids": ["M2"], "fixed_by": "logos-qt-sdk cdylib glue (kVoidMethods) + logos-rust-sdk void arms", "what": "a `void` return answered `true` from the C++ provider and METHOD_FAILED from the Rust one.", "why_it_looked_like_a_disagreement": {"_prose": "bullets", "parts": ["It was not one. `void` is not a LIDL builtin, so `-> void` parses as Named(\"void\"). The C++ cdylib backend has an arm keyed on that name and returns \"true\"; the Rust backend had none, so void fell to the catch-all that maps every unrecognised Named to serde_json::Value — and the module returned JSON null.", "null is the failure token further up: logos_json_convert turns it into an invalid QVariant, and core_service reports that as METHOD_FAILED. So the Rust side never rejected anything; the failure was manufactured downstream, in C++.", "The metadata diverged too, unregistered: Rust advertised returnType \"QVariant\" for a void method where C++ advertised \"void\"."]}, "how_it_was_closed": "in the shared cdylib glue, which derives the void-method set from the contract both backends compile — so a third language backend cannot re-open it — plus void arms in the Rust generator so the C ABI and the interface JSON agree rather than being papered over at the Qt boundary.", "residual": {"_prose": "bullets", "parts": ["`true` is a FABRICATED value: wire-indistinguishable from a real `-> bool` returning true, and LMS-2 §4.8 says the spec answer is null.", "Converging on null instead would have been more correct and was rejected on evidence, not taste: an invalid QVariant is the failure token on that slot, and live callers already depend on `true` (logoscore-cli integration tests, logoscore-py integration tests, and a real QML void call in logos-tutorial).", "So the underlying conflation — null/invalid-QVariant means failure, leaving no way to say \"succeeded, no value\" — is UNCHANGED. Both backends now tell the same lie. Fixing it properly needs a success channel that does not overload the value slot."]}, "verified": "void/return goes from a pinned per-provider divergence to a single agreeing expectation."}, {"ids": ["M4"], "fixed_by": "logos-protocol — logos::isPendingCallSentinel, replacing a bare contains() at all four detection sites", "what": "a user map that merely CARRIED the sentinel key was taken for a deferred call.", "measured_before_and_after": {"echoAny({\"__logos_pending_call__\": 1, \"x\": 2}) before": "the call hung for the full timeout, then failed", "after": "echoes back as the ordinary map it is, on both providers"}, "note": {"_prose": "bullets", "parts": ["The registry's own `measured` line said RPC_FAILED. That was STALE — the recorded outcome is TimeoutExpired: the consumer extracts a call id, finds no completion, and waits out a nested event loop. A fast failure and a 20-second hang are different bugs, and the entry described the wrong one.", "`fix_is: same class as M3` was also wrong for the payload actually measured. M3 is inherent — a one-key `_bytes` map IS the encoding. THIS was a missing shape check, and two sibling detectors in the same repo already had it: isTaggedBytes (logos_codec.h) and isUnauthorizedSentinel (logos_rpc_status.h), the latter landing a month AFTER these checks. The difference was chronology, not principle.", "Behaviour-preserving: the generated glue constructs this map with exactly one entry whose value is a QString call id, so no real sender is affected."]}, "residual": "see M4-residual — the canonical-shape forgery survives, and this entry must not be read as closing it"}, {"ids": ["pre-99-null-is-not-an-error"], "fixed_by": "logos-logoscore-py relocking logos-logoscore-cli onto master (0f0be25), which carries ed19258 (#99) and b3f1a403 (#101).", "what": "Classes A, C and D were one indistinguishable METHOD_FAILED because CoreServiceImpl::callModuleMethod took the invokeRemoteMethod overload with no CallError* and decided the verdict by testing ret.is_null() on the RESULT.", "verified": "#99 reads the error channel and emits {code, message, origin}, and on a null return asks the module for getPluginMethods so an unknown name becomes METHOD_NOT_FOUND with available_methods. #101 widened the rejection fold to the closed set {dispatch_failed, invalid_args, unknown_method}. 18 cells — three cases x two providers x three consumers.", "watch_for": "failure/A/module-not-loaded is NOT deterministic: the acquire takes ~20s and under load outruns the core_service RPC's own deadline, so the daemon reports the RPC as failed instead of the acquire and the cell answers RPC_FAILED instead of METHOD_FAILED. That could not redden the gate while this entry stood, because both tokens were a failing cell. It CAN now that the cell is expected to pass. Measured across 42 samples: 3 of 7 runs had zero hits, and 1 of 14 py samples hit it."}, {"ids": ["B-arity-overflow"], "fixed_by": "logos-plugin-qt#29 (f668ef2), carried by logos-module-builder 6044ffc. The provider half was logos-cpp-sdk#150 and logos-rust-sdk#50; this is the consumer half.", "what": "An EXTRA argument was dropped and the call succeeded. The last six cells were failure/B/arity/too-many-zero-parameter on `doVoid`, where the provider refused correctly and the Qt host glue discarded the refusal.", "verified": "6 of 6 xpass — void/method_return on both providers across all three consumers. Nothing else moved: pass 560, xfail 10 (M4-residual 6 + M3 4), no fail.", "note": "TWO SITES, and the second was found only by re-measuring. logos-plugin-qt#28 fixed the multi-concurrency path; the single path returned early via `kVoidMethods.contains(methodName)` before reaching it. With #28 in the builder — verified root-to-leaf through the lock AND by content — these six cells were still xfail. The fix was in the build and the cells had not moved, which is what located the second site. Reading the diff would not have.", "cost_of_retiring_early": "18 of these 24 cells flipped one bump earlier, and the obvious move was to retire the whole entry then. Had that happened, the six doVoid cells would have been deleted while still broken, and the glue would have gone on reporting refusals as successful calls with nothing watching."}], "unmeasurable": [{"id": "M3-history", "supersedes": "the M3 entry that lived here", "summary": "M3 is no longer unmeasurable — it moved to `xfail` with a coordinate. This is the record of why it sat here, because the reason is a reusable lesson about what a matrix can and cannot see.", "what_this_section_got_right": {"_prose": "bullets", "parts": ["That the earlier xfail was measuring the wrong thing: the python CLIENT decoding the tag, not the system collapsing the map. With `decode_bytes=False` the `any` cells round-trip byte-for-byte, so no change to any C++ repo could ever have made them xpass — the registry's forcing function was inert.", "That the defect was real anyway, and that closing it needs a data-model change rather than a predicate.", "The prescription: a headless `type: core` module with no `interface` key, driveable by logoscore in-sandbox. That is exactly what test_fullapi_qtproxy is, and it worked."]}, "what_it_got_wrong": {"_prose": "bullets", "parts": ["It looked for the collision on the `any` slot, where the transformation is its OWN INVERSE — map to QByteArray to the same map — so a round-trip cell there is green no matter what happens in between. The observation was one cell over the whole time: a typed map slot (`echoMap`), where the collision is lossy and the payload arrives as {}.", "So `unmeasurable` was slightly too strong. It was unmeasurable BY THE CELL THE ENTRY WAS WATCHING, on the consumer the matrix had. Two different limits, and conflating them is how a defect stays parked."]}, "generalisation": "when a suspected transformation is invertible, an echo cell cannot see it. Measure it where a type is asserted (a typed slot, or a type-tagged rendering like the proxy's getLastEvent) — not where the value merely comes back."}]}, "registry_used": {"M3": [{"cell": "adversarial/{tstr:any}/_bytes-key/test_fullapi_cpp/qtproxy-async", "status": "xfail", "case": "adversarial/{tstr:any}/_bytes-key"}, {"cell": "adversa rounding, not a wrap to -1: the exact value comes back, so the decode never went through an i64 at all.", "both providers, through the Qt proxy (sync and async)": "REJECTED, with the same sentence and the same coordinate, `origin: test_fullapi_ext_qtproxy`. The proxy's own cdylib dispatch decodes the argument into std::vector<std::vector<int64_t>> before it ever calls out, so the Rust provider is never offered the out-of-range number. The defect is therefore INVISIBLE on two of this table's three consumers — which is what makes it worth a case: the consumer differential prints it as py disagreeing with both proxy points, on the provider that has the hole.", "the neighbouring positive control": "echoNestedInts([[-9007199254740993, 9007199254740993]]) — both edges outside double precision, at depth 2 — round-trips identically on all six provider x consumer surfaces. The hole is the RANGE check, not the depth."}, "fix_is": "a range check in test_fullapi_ext_rust's `[[int]]` element decode, i.e. in the Rust backend's generated container loop rather than in the fixture — the fixture declares `[[int]]` and nothing else. It retires when this cell rejects on the Rust provider with the class the C++ one already reports.", "note": {"_prose": "bullets", "parts": ["Found by probing the nested widened containers directly rather than by the table, and then given a case so it has a forcing function. The case is stated as a plain `expect`, NOT as expect_by_provider: the two providers implement one contract and one of them is wrong, so declaring the divergence would freeze the hole into the contract.", "Registered against the RUST provider and the `py` consumer ONLY. The proxy consumers pass, and they must keep passing — if the day comes that a proxy cell here goes red, the proxy's own decode has lost the check too, and that is a second defect, not this one."]}}, {"id": "ext-bstr-leniency-canonicalised-by-the-proxy", "cases": ["[bstr]/lenient-plain-string"], "providers": ["test_fullapi_ext_rust"], "consumers": ["extqtproxy-sync", "extqtproxy-async"], "summary": "the one DECLARED provider divergence in this table stops diverging through a proxy — the hop canonicalises the plain string to tagged bytes before the provider ever sees it", "correct_behaviour": "the case says: a plain JSON string in a `[bstr]` slot is accepted leniently by test_fullapi_ext_rust and echoed back as a string, while test_fullapi_ext_cpp canonicalises it to tagged bytes. That is a statement about the two PROVIDERS' decoders, and it can only be measured by a caller that reaches a provider directly.", "measured": {"py": "providers DIFFER: ext_rust -> [\"hi\"], ext_cpp -> [{\"_bytes\": \"aGk\"}]. The declared divergence, unchanged.", "extqtproxy-sync / extqtproxy-async": "providers AGREE: both answer [{\"_bytes\": \"aGk\"}]. The proxy's own cdylib dispatch decodes the `[bstr]` argument into std::vector<std::vector<uint8_t>> — leniently, the C++ way — and re-encodes it as tagged bytes on the outbound call, so the Rust provider is never offered a plain string and its leniency is never exercised. The ext_cpp cell still passes because its expectation is already the canonical form; the ext_rust cell fails.", "the same divergence is DEEPER and WIDER than the one case says, measured by hand and NOT given cases here": "the registered case puts a plain string at depth 1 of [bstr]. Three more shapes do the same thing and none is in the table: `echoMapOfBytesLists({\"k\": [\"hi\"]})` — a plain string TWO containers deep — answers 0x6869 on ext_cpp and \"hi\" on ext_rust; `echoMapOfBytesLists({\"k\": [42]})` answers the two ASCII bytes 0x3432 on ext_cpp and the number 42 on ext_rust; `echoBytesList([[1, 2]])` answers 0x0102 on ext_cpp and [1, 2] on ext_rust. Through either proxy consumer all three answer the ext_cpp form, the same masking this entry describes. They are recorded and deliberately NOT turned into cases: the second one is not leniency but a COERCION — the number 42 became the bytes of its decimal spelling — and whether a bstr slot should coerce, reject, or keep being lenient is a decision about the contract that the ext table's owner has not made. Writing an expectation would make that decision by accident, and writing it as expect_by_provider would freeze the disagreement. What is not in doubt: the positive control passes everywhere — {\"k\": [0x0080ff, empty]} round-trips byte-identically on all six provider x consumer surfaces.", "the report says so on its own": "the DECLARED DIVERGENCES block prints `[bstr]/lenient-plain-string VARIES BY CONSUMER — py: providers DIFFER; extqtproxy-sync/async: providers agree — no longer diverges`. That line existed before this entry and had nothing to compare against; it is the thing worth reading here."}, "fix_is": "nothing in the system. This is a property of what a proxy cell CAN measure: a value that crosses two decoders is reported by the second one, so a leniency in the first is invisible unless the first is the one being called. The cell stays in the table for py, and is registered here for the surfaces that structurally cannot see it.", "note": {"_prose": "bullets", "parts": ["Deliberately NOT spelled as a per-consumer expectation. Widening expect_by_provider to an expect_by_consumer would pin `the proxy canonicalises` as a CONTRACT, and it is not one — it is what happens to be true of one decoder pair today. If the C++ decoder stopped being lenient, this cell would answer something else through the proxy and an expectation would still be green.", "The honest alternative is a `skip[]` entry — `this surface cannot express the cell` — and it was rejected because the surface DOES answer, with a defensible value. A skip would hide a real measurement; an xfail keeps it printed with the reason attached.", "NOT cross-case pollution, MEASURED: this case was in the same `isolate: true` A/B as the four Optional cells above (see ext-optional-return-shape-through-the-qt-proxy). Giving it a daemon of its own changed nothing — both proxy consumers still answer [{\"_bytes\": \"aGk\"}] on test_fullapi_ext_rust, and py still answers [\"hi\"]."]}}], "skip": [], "coverage_limits": [], "fixed": [{"ids": ["E1", "E2", "E3"], "fixed_by": "logos-protocol 362b03f — one canonical LIDL <-> JSON codec (#29)", "what": "bytes at depth mangled (E1), an empty nested bstr arriving as null (E2), and M1 seen through a record field (E3).", "verified": "all 22 registered cells went xpass on the re-pin, and the two ext providers now agree on every case — the differential went from 10 pass / 9 xfail to 19/19."}, {"ids": ["OPT1"], "fixed_by": "logos-lidl#7 (contract + accessors), logos-protocol#37 (Codec<std::optional<T>>), logos-rust-sdk#31 (Ty::Opt, Option<T>), logos-cpp-sdk#125 (cdylib gate, record codecs, header parser)", "what": "optionality is declared by the contract and read by NO generator, in any language", "verified": "conformance-matrix-ext, 39 cases x 2 providers x 1 consumer (py; the table had no consumer axis yet): 76 pass / 2 xfail / 0 fail. The six cells this entry covered went xpass, which is what forced it out of xfail.", "correct_behaviour": {"_prose": "bullets", "parts": ["`?T` is TWO-state: a value of T, or empty — never three-state, because one LIDL type maps to one type per language and every target has exactly one empty inhabitant (None / nullopt / invalid QVariant / undefined).", "DECODE is liberal in an optional slot: an omitted key and an explicit null both decode to empty. In a REQUIRED slot both stay errors (hostile/Optional/record/required-absent and /required-null pin that, and they pass today).", "ENCODE has ONE canonical form: empty is spelled by OMITTING the key where the slot is NAMED (a record field), and by null where the slot is POSITIONAL (method arg, return, event param) — a positional slot has no key to omit and the arity must never change. The round trip is therefore canonicalising, not identity.", "A present-but-wrong-typed value in an optional slot is STILL AN ERROR: optional widens the domain by exactly one inhabitant, it does not disable type checking. That is hostile/Optional/scalar/wrong-type, and it is the cell that separates a real implementation from `?T` = `any`."]}, "measured": {"logos-lidl": "parses BOTH spellings correctly and has done all along — parser.cpp:145 sets FieldDecl::optional for `? name: T`, parser.cpp:220 builds TypeExpr::Optional for `?T`, and json.cpp carries both across the AST boundary. The information is present at every backend's door; nothing opens it. `git grep '\\.optional'` across logos-rust-sdk, logos-cpp-sdk and logos-qt-sdk finds exactly one hit, in a rustgen unit test.", "logos-rust-sdk lidl-gen": "no TypeKind::Optional arm anywhere. `?tstr` falls to the catch-alls: rust_param_type gives the author `serde_json::Value`, and ty_descriptor gives the dispatch `args::Ty::Any` — i.e. no validation at all. The FIELD FLAG takes the opposite route: `? maybe: tstr` keeps ty=tstr, so the field is typed String, args::Ty::Record checks it as Tstr, and an absent key is rejected with `expected string at arg0.maybe, got null` (args.rs coerces a missing key to Value::Null, so absent and explicit-null are already indistinguishable there — which is the ONE part of the contract that already holds). Two spellings the spec calls equivalent, opposite behaviour.", "logos-rust-sdk rustgen record decode": "a SECOND gate behind the first: from_json is emitted as `o.get(\"f\")?.as_str()?`, whose `?` short-circuits the whole Option. Even if Ty::Record learned optionality, a record with an absent field would still decode to None as a unit.", "logos-rust-sdk to_json": "always writes the key, so a Rust peer cannot currently EMIT an absent field at all — the encode half of the contract has no expression in the generated code.", "logos-cpp-sdk cdylib backend": "EXECUTED against exactly these declarations. `?T` is a hard codegen reject — typeSupported() (lidl_gen_cdylib.cpp) has no TypeExpr::Optional arm, so `method echoOptional(v: ?tstr) -> ?tstr` fails the build with `Error: module not cdylib-eligible: method 'echoOptional': parameter 'v' has a type outside the cdylib-supported (Qt-free) subset` (exit 10). With that method removed, the record IS accepted and emitRecordCodecs ignores the flag completely: it emits `Codec<std::string>::from(j.contains(\"maybe\") ? j.at(\"maybe\") : nlohmann::json(), path + \".maybe\")`, i.e. absent becomes a typeError, and `out[\"maybe\"] = Codec<std::string>::to(v.maybe)` on the way back, i.e. the key is always written.", "logos-cpp-sdk impl-header parser": "EXECUTED. std::optional<T> is unrecognised and falls into the `Fallback: treat as opaque` arm, so a header-first C++ provider CANNOT EXPRESS an optional at all: `std::optional<std::string> maybe` derives as `maybe: any`, `std::optional<std::string> echoOptional(...)` derives as `method echoOptional(v: any) -> any`. Silently — no warning, and the derived contract then disagrees with the Rust provider's on a table whose whole purpose is that the two agree.", "logos-cpp-sdk / logos-qt-sdk emit": "lidl_emit_common.cpp maps TypeExpr::Optional to `QVariant` in both directions (lidlTypeToQtTypeName and lidlTypeToStd) — the untyped `any` spelling, which is exactly the modelling hostile/Optional/scalar/wrong-type exists to reject."}, "fix_is": {"_prose": "bullets", "parts": ["logos-lidl: `fieldIsOptional(f) = f.optional || f.type.kind == Optional` and `fieldValueType(f)`, so the two spellings are collapsed ONCE, at the front end, and no backend re-derives the equivalence (three re-derivations is three chances to disagree).", "logos-rust-sdk: Option<T> in rust_param_type/owned_type, `Ty::Opt` in args.rs, and a from_json that does not `?` on an absent optional key.", "logos-cpp-sdk: TypeExpr::Optional through the impl-header parser (std::optional<T> -> Optional), an Optional arm in typeSupported(), and Codec<std::optional<T>> in logos-protocol's logos_codec.h — absent OR null decodes to nullopt, nullopt encodes by omitting a named key.", "Qt is OUT OF SCOPE: logos-qt-generator had zero module.types handling, so records did not compile through --backend qt at all. (That backend has since been REMOVED from logos-qt-generator, which now emits only --backend consumer and --backend ui; the Qt-plugin provider glue comes from logos-plugin-qt's logos-qt-host-generator --backend cdylib.) Fixing that is a different piece of work and must not be smuggled in here."]}, "note": {"_prose": "bullets", "parts": ["Registered as ONE entry because it is one missing feature, not six defects. When it lands, all six cells go xpass together and this entry gets deleted in the same commit.", "Three cells in the family are deliberately NOT registered because they PASS today and must keep passing: hostile/Optional/record/wrong-type-in-optional-field, hostile/Optional/record/required-absent and hostile/Optional/record/required-null. They pass by accident — the flag is ignored, so the field is checked as a plain tstr — and the natural implementation of optional decoding, `o.get(\"maybe\").and_then(|v| v.as_str())`, would turn the first one red while turning the six above green. That is the shape of the lazy fix this family is built to catch."]}}, {"ids": ["ext-optional-return-changed-on-one-provider", "ext-optional-return-shape-through-the-qt-proxy"], "fixed_by": "logos-test-modules — both providers of the ext contract declare `echoOptional(v: ?tstr) -> ?tstr`, plus logos-qt-sdk `logosResultFromReply` for the second, independent half.", "what": "One contract had two providers answering different SHAPES: the Rust LIDL had been moved to `-> result` and test_fullapi_ext_cpp, being header-first, kept deriving `-> ?tstr`. The `-> result` spelling was a workaround for a qt-generator gate that REFUSED `-> ?T`; that gate is retired and `?T` now maps to std::optional<T>, so the workaround outlived its cause. Reverting the Rust side is what makes the two agree, and `?tstr` is the shape the case table already expected.", "also": "The proxy half was never only about which shape wins. A Qt wrapper that could not decode a reply returned a DEFAULT-CONSTRUCTED LogosResult, and that default — success=false, error null — is byte-for-byte a provider refusal, so a decode failure impersonated an answer for every input including the well-formed ones. Fixed independently in logos-qt-sdk: `logosResultFromReply` reports a transport error with its own message and a non-object reply as a decode failure naming the type it got. That fix stands whichever shape the contract had chosen."}, {"ids": ["pre-99-null-is-not-an-error"], "fixed_by": "logos-logoscore-py relocking logos-logoscore-cli onto master (0f0be25), which carries ed19258 (#99) and b3f1a403 (#101).", "what": "The same daemon defect seen from the ext table.", "verified": "#99 reads the error channel and emits {code, message, origin}, and on a null return asks the module for getPluginMethods so an unknown name becomes METHOD_NOT_FOUND with available_methods. #101 widened the rejection fold to the closed set {dispatch_failed, invalid_args, unknown_method}. 12 cells — two cases x two providers x three consumers.", "watch_for": "failure/A/module-not-loaded is NOT deterministic: the acquire takes ~20s and under load outruns the core_service RPC's own deadline, so the daemon reports the RPC as failed instead of the acquire and the cell answers RPC_FAILED instead of METHOD_FAILED. That could not redden the gate while this entry stood, because both tokens were a failing cell. It CAN now that the cell is expected to pass. Measured across 42 samples: 3 of 7 runs had zero hits, and 1 of 14 py samples hit it."}, {"ids": ["OPT2"], "fixed_by": "the same logoscore-cli relock that retired pre-99-null-is-not-an-error (0f0be25, #99).", "what": "An EMPTY optional in a positional slot had no expressible form: null was already the failure token, so `?tstr` returning empty and a failed call were one answer.", "verified": "MEASURED, not predicted: this entry was deliberately left registered across the relock so the gate would decide it, and the run reported `xpass ?tstr/method_arg,method_return/test_fullapi_ext_cpp/py`. pre-99's own note had said OPT2 was the class-D half and would retire in the same edit; it was kept anyway rather than retired on that reasoning, because an xpass is evidence and an argument is not.", "note": "The entry's `fix_is` had called the return side 'a real decision, not a patch' -- either presence travels out of band, or `?T` is declared unusable as a bare return. Neither happened. What happened is that the daemon stopped inferring failure from a null RESULT and started reading the error channel, so null in the value is no longer overloaded. That was the third possibility the entry did not name."}, {"ids": ["B-arity-overflow"], "fixed_by": "logos-cpp-sdk 692af75 (#150) and logos-rust-sdk d3fe4b4 (#50), carried here by logos-module-builder c021491 (#216).", "what": "An EXTRA argument was dropped and the call succeeded. The generated dispatches guarded `args.size() < minArgs` and nothing bounded the other direction.", "verified": "12 of 12 cells xpass on the relock — both cases, both providers, all three consumers, `got {\"__error__\": \"invalid_args\"}`. This table's zero-parameter case rides `whoAmI`, which returns tstr, and it flipped with the rest."}], "unmeasurable": []}, "registry_used": {"ext-nested-int-range-unchecked-on-one-provider": [{"cell": "[[int]]/out-of-signed-range/test_fullapi_ext_rust/py", "status": "xfail", "case": "[[int]]/out-of-signed-range"}], "ext-bstr-leniency-canonicalised-by-the-proxy": [{"cell": "[bstr]/lenient-plain-string/test_fullapi_ext_rust/extqtproxy-async", "status": "xfail", "case": "[bstr]/lenient-plain-string"}, {"cell": "[bstr]/lenient-plain-string/test_fullapi_ext_rust/extqtproxy-sync", "status": "xfail", "case": "[bstr]/lenient-plain-string"}]}, "registry_used_differential": {"ext-nested-int-range-unchecked-on-one-provider": [" <script>
/* ── what this page is ────────────────────────────────────────────────────
   A single-table page embeds the payload for ONE contract, unchanged. A merged
   page embeds {"reports":[{ns,name,href,payload}, ...]} — the SAME payload
   objects, one per contract, never combined into one.

   Nothing here computes a number that spans contracts. The two tables are
   different measurements: different contracts, different case tables and
   registries, different PROVIDERS, different consumer axes. A blended count
   would hide which contract owns a failure, and the differential — providers

   contract it is showing — otherwise the table that failed simply vanishes and

let D = REPORTS[0].payload, NS = REPORTS[0].ns;

const GLYPH = {pass:"\u00b7", xfail:"K", fail:"X", xpass:"^", skip:"~", "not-run":"?"};
const CLS   = {pass:"ok", xfail:"kn", fail:"bad", xpass:"xp", skip:"sk", "not-run":"bad"};

  "method_arg@2":"a2", method_return:"ret", event_param:"evt",

/* There is deliberately NO value-to-text helper here. Every measured value is

  return out;

/* Only the `test_fullapi_` stem comes off, NOT the `ext_` that follows it: on a

   the full contract's `cpp, rust`. They are different modules, and the whole
   point of the page is that the two rows are different measurements. */
const shortProv = p => p.replace(/^test_fullapi_/, "");

/* ── the pills for ONE contract ───────────────────────────────────

function pillsHtml(P) {
  const c = P.counts, n = k => c[k] || 0;
  const bits = [`<span class="pill pass">${n("pass")} pass</span>`];
  if (n("xfail")) bits.push(`<span class="pill known">${n("xfail")} known-broken</span>`);
  if (n("fail")) bits.push(`<span class="pill fail">${n("fail")} FAIL</span>`);
  if (n("xpass")) bits.push(`<span class="pill fail">${n("xpass")} xpass \u2014 registry stale</span>`);
  if (P.uncovered.length) bits.push(`<span class="pill fail">${P.uncovered.length} uncovered</span>`);
  if (n("skip")) bits.push(`<span class="pill dim">${n("skip")} skip</span>`);

const isRed = P => (P.counts.fail || 0) + (P.counts.xpass || 0)
  + P.uncovered.length > 0;

/* ── grid ─────────────────────────────────────────────────────────────── */
function gridCell(cell) {
  if (cell.state === "n/a") return {html:'<span class="sk">.</span>', cls:"na"};
  if (cell.state === "uncovered") return {html:"--", cls:"unc c"};
  const t = cell.tally, parts = [];
  if (t.pass) parts.push(`<span class="ok">${t.pass}ok</span>`);
  [["fail","X","bad"],["xpass","^","xp"],["xfail","K","kn"],["skip","~","sk"],
   ["not-run","?","bad"]].forEach(([k, sfx, cls]) => {
    if (t[k]) parts.push(`<span class="${cls}">${parts.length?"+":""}${t[k]}${sfx}</span>`);
  });

}
function renderGrid() {
  const P = D.axis.positions, T = D.axis.types;
  let h = `<table class="grid"><tr><th class="ty">type</th>` +
    P.map(p => `<th title="${esc(p)}">${esc(ABBR[p] || p)}</th>`).join("") + `</tr>`;
  T.forEach(ty => {
    h += `<tr><td class="ty">${esc(ty)}</td>`;
    P.forEach(p => {
      const cell = D.grid[ty][p], g = gridCell(cell);
      const title = cell.state === "covered"
        ? cell.cases.join("\n")
        : (cell.state === "uncovered"
            ? "declared by the contract, exercised by no case"
            : "no such position for this type");
      h += `<td class="${g.cls}" data-ty="${esc(ty)}" data-pos="${esc(p)}" title="${esc(title)}">${g.html}</td>`;
    });
    h += `</tr>`;
  });
  h += `</table>`;
  const surf = D.meta.providers.length * D.meta.consumers.length;
  h += `<div class="legend">
    <b><span class="ok">n ok</span></b> = n cases green on all ${surf} provider &times; consumer surfaces &nbsp;&nbsp;
    <b><span class="swatch kn">+n K</span></b> = n cases with a registered known-broken cell (never counted as a pass) &nbsp;&nbsp;
    <b><span class="bad">n X</span></b> = failing &nbsp;&nbsp;
    <b><span class="xp">n ^</span></b> = xpass, the registry is stale<br>
    <b><span class="bad">--</span></b> = declared by the contract, <b>no case</b> &nbsp;&nbsp;
    <b><span class="sk">.</span></b> = no such position for this type &nbsp;&nbsp;

  }

  return h;
}

/* ── differential ─────────────────────────────────────────────────────── */
function renderDifferential() {
  const d = D.differential;
  let h = "";
  if (d.providers.length < 2) {
    h += `<p class="lede">One provider (<code>${esc(d.providers[0] || "-")}</code>) \u2014
      nothing to compare. This table has no differential column, which is a gap,
      not a design choice.</p>`;
  } else {
    h += `<div class="card"><h3>provider &nbsp;<code>${esc(d.providers[0])}</code>
      vs <code>${esc(d.providers[1])}</code></h3><table class="flat">`;
    const KLABEL = {behaviour: "by behaviour", agree: "no longer diverging",
                    identity: "by identity"};
    d.consumers.forEach(c => {
      const s = d.by_consumer[c];
      /* The breakdown, not just the count: "6 declared divergences" reads as
         six facts about the system, and two of them are a provider spelling
         its own name. */
      const k = {};
      D.diffs.filter(x => x.declared && (x.consumer || c) === c)
        .forEach(x => k[x.kind || "behaviour"] = (k[x.kind || "behaviour"] || 0) + 1);
      const detail = ["behaviour", "agree", "identity"].filter(x => k[x])
        .map(x => `${k[x]} ${KLABEL[x]}`).join("; ");
      h += `<tr><td>on ${esc(c)}</td>
        <td class="ok">${s.agree} agree</td>
        <td class="${s.differ.length ? "bad" : "sk"}">${s.differ.length} differ</td>
        <td class="sk">${s.declared.length ? "+" + s.declared.length +
          " declared, not compared" + (detail ? ` (${esc(detail)})` : "") : ""}</td></tr>`;
    });
    h += `</table></div>`;
  }
  if (d.consumers.length < 2) {
    h += `<div class="card"><h3>consumer <span class="tag">one point</span></h3>
      <p class="lede" style="margin:0">A cell proves a provider agreed with this
      client, not that two consumer surfaces agree with each other. A defect a
      consumer happens to undo is invisible from here.</p></div>`;
  } else {
    h += `<div class="card"><h3>consumer</h3><table class="flat">`;
    for (let i = 0; i < d.consumers.length; i++)
      for (let j = i + 1; j < d.consumers.length; j++)
        h += `<tr><td>${esc(d.consumers[i])} vs ${esc(d.consumers[j])}</td></tr>`;
    h += `</table></div>`;
  }
  const decl = D.diffs.filter(x => x.declared);
  if (decl.length) {
    h += `<h3 style="font-size:13.5px;margin:20px 0 4px">Declared divergences
      <span style="font-weight:400;color:var(--muted);font-size:12px">
      (<code>expect_by_provider</code>) \u2014 what each provider actually answered</span></h3>
      <p class="lede">The driver does not compare these: the divergence <em>is</em>
      the expectation. Shown because a declared divergence that quietly stopped
      diverging is worth seeing, and it carries no verdict and no exit code.</p>
      <table class="flat"><tr><th>case</th><th></th><th>answers</th></tr>`;
    /* Behaviour first, then the ones that stopped diverging, then identity.
       `kind` is decided in python (see _divergence_kind) so the page and the
       terminal cannot classify the same divergence differently. */
    const KIND = {behaviour: 0, agree: 1, identity: 2};
    [...decl].sort((a, b) => (KIND[a.kind] ?? 0) - (KIND[b.kind] ?? 0)).forEach(x => {
      /* One provider per line: the difference between two long values is
         usually deep inside them, and a side-by-side truncation hides it.
         When they AGREE there is no difference to place, so the value is
         stated once. */
      /* values_s, not values: pre-rendered in python so a uint64 answer is not
         re-encoded through a double on the way to the screen. */
      const ents = Object.entries(x.values_s || {});
      const vals = x.kind === "agree" && ents.length
        ? `<div><b>both</b> ${esc(clip(ents[0][1], 150))}</div>`
        : ents.map(([p, v]) =>
            `<div><b>${esc(shortProv(p))}</b> ${esc(clip(v, 150))}</div>`).join("");
      /* "Both providers now answer the same" is not good news and is not
         green: it means the per-provider split in the table is vestigial.
         Same shape of finding as an xpass, same colour. */
      const verdict = x.kind === "agree"
        ? `<span class="xp">NO LONGER DIVERGES</span>
           <div class="sk" style="font-size:11.5px">the declaration is vestigial</div>`
        : x.kind === "identity"
        ? `<span class="sk">DIFFER</span>
           <div class="sk" style="font-size:11.5px">by identity — true by construction</div>`
        : `<span class="kn">DIFFER</span>
           <div class="sk" style="font-size:11.5px">by behaviour</div>`;
      h += `<tr><td>${esc(x.case)}</td><td>${verdict}</td><td>${vals}</td></tr>`;
    });

  }

}

/* ── cases ────────────────────────────────────────────────────────────── */
function stripHtml(cv) {
  return D.meta.consumers.map(c =>
    `<span class="g">` + D.meta.providers.map(p => {
      const e = cv.results[p + "|" + c] || {status: "not-run"};
      return `<span class="${CLS[e.status] || ""}" title="${esc(p + " / " + c + " \u2014 " + e.status)}">${GLYPH[e.status] || "?"}</span>`;
    }).join("") + `</span>`).join(" ");

function posLabel(cells, onlyType) {
  const p = cells.filter(c => !onlyType || c[0] === onlyType).map(c => c[1]);
  if (p.length === 2 && p[0] === "method_arg" && p[1] === "method_return") return "arg\u2192ret";
  return [...new Set(p)].map(x => ABBR[x] || x).join(",");
}
/* What the case sent and what the table expects, on ONE dim line. A green cell

   only where something did not match. */
function callHtml(cv) {
  /* Every value here comes PRE-RENDERED from python (cv.render). JSON.parse
     puts numbers in doubles, so reading cv.args/cv.expect would print
     18446744073709552000 for the case that exists to prove
     18446744073709551615 survives. clip only — never re-encode. */

  if (!r.sent) return "";
  const sent = esc(clip(r.sent, 100));
  let want = "";
  if (r.want_kind === "identical")
    /* One expectation written N times is not N expectations. */
    want = `${esc(clip(r.want, 90))} <span class="where">(declared per provider, identical)</span>`;
  else if (r.want_kind === "identity")
    /* Values differing only by the provider's own name render identically
       once truncated; the full pair lives in the differential panel. */
    want = `<span class="where">each provider answers with its own name &mdash;
       see <a href="#${esc(nsid("differential"))}">differential</a></span>`;
  else if (r.want_kind === "per_provider")
    want = (r.want_pairs || []).map(([p, v]) =>
      `${esc(p)} ${esc(clip(v, 46))}`).join(" &nbsp;|&nbsp; ");
  else if (r.want_kind === "one")
    want = esc(clip(r.want, 90));
  return `<span class="call">${sent}${want ? ` <span class="arrow">&rarr;</span> ${want}` : ""}</span>`;
}
function valuesHtml(cv) {
  /* Identical outcomes on several surfaces print once, named: two providers
     failing the same way is one fact, not two. */
  const groups = new Map();
  Object.entries(cv.results).forEach(([k, e]) => {
    if (e.status === "pass") return;
    /* Grouped and displayed on the PRE-RENDERED text, for the same reason
       callHtml is: two values that differ only above 2^53 are one value once
       JSON.parse has been through them. */
    const sig = JSON.stringify([e.status, e.expected_s === undefined, e.expected_s, e.actual_s]);
    (groups.get(sig) || groups.set(sig, {e, keys: []}).get(sig)).keys.push(k);
  });
  let h = "";
  groups.forEach(({e, keys}) => {
    const where = keys.length === Object.keys(cv.results).length
      ? "all surfaces" : keys.join(", ");
    let t = `<b>${esc(e.status)}</b> <span class="where">${esc(where)}</span>`;
    if (e.expected_s !== undefined) t += `\n<b>expected</b> ${esc(clip(e.expected_s, 300))}`;
    t += `\n<b>got     </b> ${esc(clip(e.actual_s, 300))}`;

}
function renderCases() {
  /* A case is listed under EVERY type it exercises: `arity/triple` has type
     "int,tstr,bstr", which is three types, one per slot — not one. */
  const byType = {}, anchored = new Set();
  D.cases.forEach(cv => [...new Set(cv.cells.map(c => c[0]))].forEach(ty =>
    (byType[ty] = byType[ty] || []).push(cv)));
  /* re-sorted per block: the payload's global order is keyed on case.type, which
     for a multi-argument case is a LIST of types */
  Object.values(byType).forEach(cs => cs.sort((a, b) =>
    a.tag_rank - b.tag_rank || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)));
  let h = `<p class="lede">Glyph groups are
    (<code>${D.meta.providers.map(shortProv).map(esc).join(", ")}</code>), one group per
    consumer: <code>${D.meta.consumers.map(esc).join(", ")}</code> &mdash;
    <span class="ok">&middot;</span> pass,
    <span class="kn">K</span> registered known-broken,
    <span class="bad">X</span> fail, <span class="xp">^</span> xpass.

      `</span><span class="pos">${esc(positions)}</span></div>
      <table class="cases">`;
    cs.forEach(cv => {
      const d = cv.differential;
      const agree = d ? (d.agree ? "=" : (d.declared ? "\u2260*" : "\u2260")) : "";
      const kids = cv.known.map(k =>
        `<a class="kid" href="#${esc(nsid("reg-" + k))}">${esc(k)}</a>`).join("");
      const tags = cv.tags.map(t => `<span class="tagchip">${esc(t)}</span>`).join("");
      /* a case listed under three types must not carry the anchor three times */
      const anchor = anchored.has(cv.id) ? "" : ` id="${esc(nsid("case-" + cv.id))}"`;
      anchored.add(cv.id);
      h += `<tr class="c"${anchor} data-case="${esc(cv.id)}"

              data-status="${esc(cv.rollup)}" data-ty="${esc(cv.type)}"
              data-pos="${esc(cv.cells.map(c => c[1]).join(" "))}">

/* ── registry prose, rendered generically ─────────────────────────────── */
/* A registry entry has no fixed schema \u2014 the four in known.json carry four
   different key sets \u2014 so prose is rendered generically, by shape. */
const SKIP_KEYS = new Set(["id", "ids", "cases", "providers", "consumers",
  "per_case_providers", "per_case_consumers", "axis", "summary"]);
function proseHtml(entry, also) {
  let h = `<dl class="kv">`;
  Object.entries(entry).forEach(([k, v]) => {
    if (SKIP_KEYS.has(k) || (also && also.includes(k))) return;
    if (v === null || v === undefined) return;
    let body;
    if (v && typeof v === "object" && v._prose) {
      body = v._prose === "bullets"
        ? `<ul>${v.parts.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
        : v.parts.map(x => `<p>${esc(x)}</p>`).join("");
    } else if (Array.isArray(v)) {
      body = `<ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    } else if (typeof v === "object") {
      body = `<ul>${Object.entries(v).map(([kk, vv]) =>
        `<li><code>${esc(kk)}</code> \u2014 ${esc(vv)}</li>`).join("")}</ul>`;
    } else body = esc(v);
    h += `<dt>${esc(k)}</dt><dd>${body}</dd>`;
  });
  return h + `</dl>`;
}
function renderRegister() {

function renderNotMeasured() {

function renderHistory() {

/* Every section is rendered behind this. The page is assembled as ONE
   innerHTML assignment, so before this guard a single throw anywhere in any
   section left <main> completely empty — a blank report that looks like "no
   data" rather than "a bug in one panel". Now the failing panel says so and
   the rest of the report still renders. */
function safeSection(name, fn) {
  try { return fn(); }
  catch (e) {
    return `<p class="lede">This section failed to render: <code>${esc(name)}: ${esc(e.message)}</code>.
      The rest of the report is unaffected; the data is intact in the jsonl.</p>`;
  }
}
function renderAll() {
  let h = `<p class="lede">Completeness, reachable but not the landing view: one row per
    (case, provider, consumer) cell, ${D.meta.cell_count} in total.</p>
    <details><summary>show every cell</summary><table class="flat">
    <tr><th>status</th><th>type</th><th>position</th><th>provider</th><th>consumer</th>
    <th>case</th><th>known</th></tr>`;
  const surfaces = surfacesOf(D);
  D.cases.forEach(cv => surfaces.forEach(k => {
    const e = cv.results[k];
    if (!e) return;
    h += `<tr><td class="${CLS[e.status]}">${esc(e.status)}</td><td>${esc(cv.type)}</td>
      <td>${esc(cv.position)}</td><td>${esc(e.provider)}</td><td>${esc(e.consumer)}</td>
      <td>${esc(cv.id)}</td><td class="kn">${esc(e.known || "")}</td></tr>`;
  }));
  return h + `</table></details>`;
}

/* ── one contract's panel ─────────────────────────────────────────────────
   Exactly the report that has always been rendered here, with its section ids
   namespaced so several contracts can share a page without colliding. Every
   section is behind safeSection(): the panel is written with ONE innerHTML
   assignment, so an uncaught throw anywhere in it would leave the whole page
   empty — and on a merged page that would take the OTHER contract's report
   down with it. A broken panel says so and nothing else moves. */
function renderContract(R) {
  D = R.payload;
  NS = R.ns;
  const m = D.meta;
  const link = R.href
    ? ` &middot; <a href="${esc(R.href)}">standalone page</a>` +
      (String(R.href).endsWith("/")
        ? ` &middot; <a href="${esc(R.href)}matrix.jsonl">jsonl</a>
            &middot; <a href="${esc(R.href)}matrix.txt">text</a>` : "")
    : "";
  return `<div class="contract" data-ns="${esc(R.ns)}">
  <p class="lede">Contract <code>${esc(m.contract_name || "full_api")}</code> &middot;
    ${m.case_count} cases &times; ${m.providers.length} provider(s)
    &times; ${m.consumers.length} consumer(s) = ${m.cell_count} cells &middot;
    generated ${esc(m.generated)}${link}<br>
    providers <code>${m.providers.map(esc).join("</code> <code>")}</code> &middot;
    consumers <code>${m.consumers.map(esc).join("</code> <code>")}</code> &middot;
    transport LocalSocket/QtRO</p>
  <section id="${esc(nsid("grid"))}"><h2>Type &times; position<span class="sub">what this system
    guarantees, per type</span></h2>${safeSection("renderGrid", renderGrid)}</section>
  <section id="${esc(nsid("differential"))}"><h2>Differential<span class="sub">this contract's
    providers compared to each other, independently of <code>expect</code></span></h2>
    ${safeSection("renderDifferential", renderDifferential)}</section>
  <section id="${esc(nsid("cases"))}"><h2>Cases<span class="sub">what was actually verified</span></h2>
    ${safeSection("renderCases", renderCases)}</section>
  <section id="${esc(nsid("register"))}"><h2>Known-broken register<span class="sub">every amber cell,
    and its claim</span></h2>${safeSection("renderRegister", renderRegister)}</section>
  <section id="${esc(nsid("notmeasured"))}"><h2>Not measured<span class="sub">on the record, not
    silently absent</span></h2>${safeSection("renderNotMeasured", renderNotMeasured)}</section>
  <section id="${esc(nsid("history"))}"><h2>Registry history<span class="sub">closed entries, and the
    guards they left behind</span></h2>${safeSection("renderHistory", renderHistory)}</section>
  <section id="${esc(nsid("all"))}"><h2>All cells</h2>${safeSection("renderAll", renderAll)}</section>
  <div class="foot">Generated by <code>run_matrix.py --report</code>. Case table and
    registry: <code>${esc((m.paths || {}).cases || "")}</code>,
    <code>${esc((m.paths || {}).known || "")}</code>. This report measures nothing; every
    number is a re-arrangement of one the driver produced.</div></div>`;
}

/* ── the contracts, side by side but never added up ───────────────────────
   The one thing a merged page must say out loud, because the layout invites
   the opposite reading: these are two measurements, not two halves of one. */
function renderContracts() {
  const n = REPORTS.length;
  const head = n === 1 ? `1 contract`
    : `${n} contracts, ${n} measurements`;
  const sub = n === 1
    ? `&mdash; the merged report, with one table present`
    : `&mdash; not ${n === 2 ? "two halves" : "parts"} of one number`;
  let h = `<div class="banner"><h2>${head}
    <span class="sub" style="font-weight:400;font-size:12.5px;color:var(--muted)">
    ${sub}</span></h2>
    <p>Each row below is its own run: its own contract, its own case table and
    registry, its own <b>providers</b>, its own consumer axis. Nothing on this page
    is summed across them, and no cell in one table has a counterpart in another
    to be compared with. The <a href="#${esc(REPORTS[0].ns)}-differential">differential</a>
    is a comparison of the providers <em>of one contract</em>; a cross-contract
    differential would be a comparison of unrelated things and is not computed.</p>
    <table class="flat">
    <tr><th>contract</th><th>providers</th><th>consumers</th><th>cases</th>
      <th>cells</th><th>result</th><th></th></tr>`;
  REPORTS.forEach(R => {
    const P = R.payload, m = P.meta;
    h += `<tr><td><a href="#${esc(R.ns)}-grid" data-goto="${esc(R.ns)}"><b>${esc(R.name)}</b></a></td>
      <td>${(m.providers || []).map(p => esc(shortProv(p))).join(", ")}</td>
      <td>${(m.consumers || []).map(esc).join(", ")}</td>
      <td>${esc(m.case_count)}</td><td>${esc(m.cell_count)}</td>
      <td>${pillsHtml(P)}</td>
      <td>${R.href ? `<a href="${esc(R.href)}">standalone</a>` : ""}</td></tr>`;
  });
  h += `</table>`;
  const tables = REPORTS.map(R =>
    `<code>${esc((R.payload.meta.paths || {}).cases || "?")}</code>`);
  h += `<p style="margin:10px 0 0;color:var(--dim);font-size:11.5px">case tables:
    ${tables.join("<br>")}</p></div>`;
  return h;
}

/* A contract whose panel throws OUTSIDE any section still gets a panel — an
   empty one, saying so. Falling back to bare text would leave the tab pointing
   at nothing, and the tab switcher would then hide every OTHER contract to show
   a panel that does not exist: one broken contract blanking the page, by a
   different route than the one safeSection closed. */
function safePanel(R) {
  try { return renderContract(R); }
  catch (e) {
    return `<div class="contract" data-ns="${esc(R.ns)}">
      <p class="lede">This contract's report failed to render:
      <code>${esc(R.name)}: ${esc(e.message)}</code>. Every other contract on
      this page is unaffected, and the data is intact in the jsonl.</p></div>`;
  }
}

/* ── assemble ─────────────────────────────────────────────────────────── */
document.getElementById("main").innerHTML =
  (MERGED ? `<section id="contracts">${
    safeSection("renderContracts", renderContracts)}</section>` : "") +
  REPORTS.map(safePanel).join("");

/* filters: text, plus the four questions worth asking of a case list.

   Declared BEFORE the tab strip, because activate() calls applyFilters() and
   `let` sits in a temporal dead zone until its declaration is evaluated. With
   this block below activate(), the very first activate() threw a
   ReferenceError inside applyFilters and took every listener after it with
   it: the tabs still switched (their listeners were already attached) and the
   chips, the search box and the grid-cell jumps did nothing at all. The page
   looked completely fine. */
let FILTER = "all";
const KEEP = {
  all: () => true,
  notgreen: tr => tr.dataset.status !== "pass",
  known: tr => tr.dataset.status === "xfail" || !!tr.querySelector(".kid"),
  hostile: tr => /hostile|adversarial/.test(tr.dataset.search),
};
function applyFilters() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll("table.cases tr.c").forEach(tr => {
    const ok = KEEP[FILTER](tr) && (!q || tr.dataset.search.includes(q));
    tr.classList.toggle("hide", !ok);
  });
  document.querySelectorAll(".typeblock").forEach(b => {
    b.classList.toggle("hide", !b.querySelector("tr.c:not(.hide)"));
  });
}
document.getElementById("q").addEventListener("input", applyFilters);
document.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  FILTER = btn.dataset.f;
  applyFilters();
}));

/* One tab per contract, carrying that contract's OWN counts. A single-table
   page has one report and no tab strip; its pills sit in the header exactly
   where they always did. */
try {
  if (MERGED) {
    document.getElementById("tabs").innerHTML = REPORTS.map(R => {
      const m = R.payload.meta || {};
      return `<button class="tab" data-ns="${esc(R.ns)}">
        <span class="tname">${esc(R.name)}</span>
        <span class="tmeta">${esc(m.case_count)} cases &middot;
          ${(m.providers || []).length} providers &times;
          ${(m.consumers || []).length} consumers</span>
        <span class="tpills">${safeSection("pills", () => pillsHtml(R.payload))}</span>
      </button>`;
    }).join("");
    document.getElementById("navtop").classList.remove("hide");
    /* An aggregate that cannot hide an owner: it NAMES the contracts that are
       red. A bare "N pass" across both would be exactly the number this page
       refuses to print. */
    const red = REPORTS.filter(R => isRed(R.payload)).map(R => R.name);
    document.getElementById("pills").innerHTML = red.length
      ? `<span class="pill fail">FAIL in ${red.map(esc).join(", ")}</span>`
      : `<span class="pill dim">${REPORTS.length} contract${
          REPORTS.length === 1 ? "" : "s"}, measured separately</span>`;
  } else {
    document.getElementById("pills").innerHTML = pillsHtml(REPORTS[0].payload);
  }
} catch (e) {
  /* The tab strip IS the merged page's navigation. A throw here used to take
     every listener below it with it, leaving a page that renders and does
     nothing. */
  document.getElementById("pills").innerHTML =
    `<span class="pill fail">header failed: ${esc(e.message)}</span>`;
}

function activate(ns) {
  const have = [...document.querySelectorAll(".contract")].map(p => p.dataset.ns);
  /* Never hide every panel to show one that is not there. */
  if (!have.includes(ns)) ns = have[0];
  document.querySelectorAll(".contract").forEach(p =>
    p.classList.toggle("hide", MERGED && p.dataset.ns !== ns));
  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("on", b.dataset.ns === ns));
  /* The header nav is shared, so it retargets at the contract on screen. */
  document.querySelectorAll("nav a[data-sec]").forEach(a =>
    a.href = "#" + (ns ? ns + "-" : "") + a.dataset.sec);
  applyFilters();
}
document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => activate(b.dataset.ns)));
document.querySelectorAll("[data-goto]").forEach(a =>
  a.addEventListener("click", () => activate(a.dataset.goto)));
activate(REPORTS[0].ns);

/* grid cell -> jump to the type block, WITHIN this contract's panel */
document.querySelectorAll(".contract").forEach(panel => {
  panel.querySelectorAll("td.c").forEach(td => td.addEventListener("click", () => {
    const el = panel.querySelector(`.typeblock[data-type="${td.dataset.ty}"]`);
    if (!el) return;
    el.classList.remove("folded");
    el.scrollIntoView({behavior: "smooth", block: "start"});
  }));
});

/* a type block folds away, so the type headers alone are a scannable index */
document.querySelectorAll(".typehead").forEach(th =>
  th.addEventListener("click", () => th.parentElement.classList.toggle("folded")));

/* deep links: #case-<id> and #reg-<id> land on a row even inside a folded
   block — and, on a merged page, even inside the contract that is not the one
   on screen: the link switches to it. */
function revealHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  const el = document.getElementById(id);
  if (!el) return;
  const panel = el.closest(".contract");
  if (panel) activate(panel.dataset.ns);
  const block = el.closest(".typeblock");
  if (block) block.classList.remove("folded");
  el.scrollIntoView({block: "center"});
}
window.addEventListener("hashchange", revealHash);
revealHash();
</script>
</body>
</html>
